<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>Platewise — Understand number plates</title>
<style>
:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da;--card:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100svh}.app{width:min(720px,100%);margin:auto;padding:12px 14px 18px;display:grid;gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.1rem;font-weight:900;letter-spacing:-.04em}.brand span{color:var(--blue)}select,input,button{font:inherit}select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 34px 8px 12px;font-weight:750;color:var(--ink);max-width:230px}.intro{display:flex;justify-content:space-between;align-items:end;gap:8px}.intro h1{font-size:clamp(1.25rem,5.3vw,2rem);line-height:1;letter-spacing:-.045em;margin:0}.badge{font-size:.58rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:5px 7px;background:#e4f3ea;color:#176a42;white-space:nowrap}.badge.basic{background:#fff1cc;color:#765500}.diagram{border:1px solid #e1e3e4;background:#ffffffb8;border-radius:22px;padding:12px 9px;display:grid;gap:12px;align-content:center}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 9px;min-height:70px}.callout b{display:flex;align-items:center;gap:6px;font-size:.75rem;margin-bottom:2px}.callout span{display:block;color:var(--muted);font-size:.65rem;line-height:1.24}.key{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:0 0 auto}.key.dark{background:#111}.key.alt{background:#63788d}.plate-wrap{display:grid;gap:9px}.plate{width:100%;min-height:94px;border:4px solid #171717;border-radius:10px;box-shadow:0 6px 0 #c7c9cb,0 12px 22px #0002;display:flex;align-items:stretch;overflow:hidden;background:#fff;color:#111}.band{width:12%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.eu{font-size:.52rem;color:#ffd43b}.countrymark{font-size:1.35rem}.mainnum{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:900 clamp(1.55rem,8.5vw,4.1rem)/1 Arial,sans-serif;white-space:nowrap;padding:0 5px}.side{width:15%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:850;font-size:.65rem}.note{text-align:center;color:#39424a;font-size:.68rem;line-height:1.3;padding:0 6px}.note strong{color:var(--blue)}.uk .plate{background:#f3c900}.nl .plate{background:#f4c900}.be .plate{color:#a30d25}.geo-button{justify-self:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:800;color:var(--ink);cursor:pointer}.geo{border-top:1px solid var(--line);padding-top:10px;display:none}.geo.open{display:block}.geo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.geo-head b{font-size:.78rem}.geo-search{width:155px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.7rem}.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:280px;overflow:auto;padding-right:2px}.code{background:#fff;border:1px solid #e2e5e7;border-radius:9px;padding:6px 7px;font-size:.64rem;line-height:1.2}.code strong{display:inline-block;min-width:2.3em;color:var(--blue)}.geo-source{font-size:.58rem;color:var(--muted);margin-top:7px}.geo-source a{color:inherit}.bottom{font-size:.67rem;color:var(--muted);text-align:center}@media(max-width:400px){.codes{grid-template-columns:1fr 1fr}.code{font-size:.6rem}}@media(max-height:700px){.app{gap:6px}.diagram{gap:7px;padding:8px}.callout{min-height:57px;padding:6px 7px}.callout span{font-size:.59rem}.plate{min-height:78px}}
</style></head><body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country" aria-label="Country"></select></header><section class="intro"><h1 id="title"></h1><span id="badge" class="badge"></span></section><section class="diagram" id="diagram"><div class="row" id="top"></div><div class="plate-wrap"><div id="plate"></div><div class="note" id="note"></div></div><div class="row" id="bottomrow"></div><button id="geoBtn" class="geo-button" type="button" hidden></button><section id="geo" class="geo"><div class="geo-head"><b id="geoTitle"></b><input id="geoSearch" class="geo-search" placeholder="Search code or place" aria-label="Search geographic codes"></div><div id="codes" class="codes"></div><div id="geoSource" class="geo-source"></div></section></section><div class="bottom" id="footer"></div></main>
<script>
const raw=`AF|Afghanistan;AL|Albania;DZ|Algeria;AD|Andorra;AO|Angola;AG|Antigua and Barbuda;AR|Argentina;AM|Armenia;AU|Australia;AT|Austria;AZ|Azerbaijan;BS|Bahamas;BH|Bahrain;BD|Bangladesh;BB|Barbados;BY|Belarus;BE|Belgium;BZ|Belize;BJ|Benin;BT|Bhutan;BO|Bolivia;BA|Bosnia and Herzegovina;BW|Botswana;BR|Brazil;BN|Brunei;BG|Bulgaria;BF|Burkina Faso;BI|Burundi;CV|Cabo Verde;KH|Cambodia;CM|Cameroon;CA|Canada;CF|Central African Republic;TD|Chad;CL|Chile;CN|China;CO|Colombia;KM|Comoros;CR|Costa Rica;HR|Croatia;CU|Cuba;CY|Cyprus;CZ|Czechia;CI|Côte d’Ivoire;CD|DR Congo;DK|Denmark;DJ|Djibouti;DM|Dominica;DO|Dominican Republic;EC|Ecuador;EG|Egypt;SV|El Salvador;GQ|Equatorial Guinea;ER|Eritrea;EE|Estonia;SZ|Eswatini;ET|Ethiopia;FJ|Fiji;FI|Finland;FR|France;GA|Gabon;GM|Gambia;GE|Georgia;DE|Germany;GH|Ghana;GR|Greece;GD|Grenada;GT|Guatemala;GN|Guinea;GW|Guinea-Bissau;GY|Guyana;HT|Haiti;HN|Honduras;HU|Hungary;IS|Iceland;IN|India;ID|Indonesia;IR|Iran;IQ|Iraq;IE|Ireland;IL|Israel;IT|Italy;JM|Jamaica;JP|Japan;JO|Jordan;KZ|Kazakhstan;KE|Kenya;KI|Kiribati;KW|Kuwait;KG|Kyrgyzstan;LA|Laos;LV|Latvia;LB|Lebanon;LS|Lesotho;LR|Liberia;LY|Libya;LI|Liechtenstein;LT|Lithuania;LU|Luxembourg;MG|Madagascar;MW|Malawi;MY|Malaysia;MV|Maldives;ML|Mali;MT|Malta;MH|Marshall Islands;MR|Mauritania;MU|Mauritius;MX|Mexico;FM|Micronesia;MD|Moldova;MC|Monaco;MN|Mongolia;ME|Montenegro;MA|Morocco;MZ|Mozambique;MM|Myanmar;NA|Namibia;NR|Nauru;NP|Nepal;NL|Netherlands;NZ|New Zealand;NI|Nicaragua;NE|Niger;NG|Nigeria;KP|North Korea;MK|North Macedonia;NO|Norway;OM|Oman;PK|Pakistan;PW|Palau;PS|Palestine;PA|Panama;PG|Papua New Guinea;PY|Paraguay;PE|Peru;PH|Philippines;PL|Poland;PT|Portugal;QA|Qatar;CG|Republic of the Congo;RO|Romania;RU|Russia;RW|Rwanda;KN|Saint Kitts and Nevis;LC|Saint Lucia;VC|Saint Vincent and the Grenadines;WS|Samoa;SM|San Marino;ST|Sao Tome and Principe;SA|Saudi Arabia;SN|Senegal;RS|Serbia;SC|Seychelles;SL|Sierra Leone;SG|Singapore;SK|Slovakia;SI|Slovenia;SB|Solomon Islands;SO|Somalia;ZA|South Africa;KR|South Korea;SS|South Sudan;ES|Spain;LK|Sri Lanka;SD|Sudan;SR|Suriname;SE|Sweden;CH|Switzerland;SY|Syria;TJ|Tajikistan;TZ|Tanzania;TH|Thailand;TL|Timor-Leste;TG|Togo;TO|Tonga;TT|Trinidad and Tobago;TN|Tunisia;TM|Turkmenistan;TV|Tuvalu;TR|Türkiye;UG|Uganda;UA|Ukraine;AE|United Arab Emirates;GB|United Kingdom;US|United States;UY|Uruguay;UZ|Uzbekistan;VU|Vanuatu;VA|Vatican City;VE|Venezuela;VN|Vietnam;YE|Yemen;ZM|Zambia;ZW|Zimbabwe`;
const countries=raw.split(';').map(x=>{const [code,name]=x.split('|');return{code:code.toLowerCase(),name}});const flag=c=>c.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt()));
const data={fr:{cls:'fr',plate:'<div class="plate"><div class="band"><span class="eu">✦✦✦</span><span class="countrymark">F</span></div><div class="mainnum">AB-123-CD</div><div class="band"><small>Normandie</small><span class="countrymark">76</span></div></div>',boxes:[['EU + F','France / EU identifier.'],['AB-123-CD','National serial; no place or date is encoded.'],['Normandie','Regional mark matching the chosen département.'],['76 · Seine-Maritime','Chosen by the owner; not where they necessarily live.']],note:'<strong>Age ❌ · Home location ❌</strong> — the SIV number stays with the vehicle for life.',foot:'Modern SIV system · since 2009',geo:'fr'},gb:{cls:'uk',plate:'<div class="plate"><div class="band"><span class="countrymark">UK</span></div><div class="mainnum">AB 26 CDE</div></div>',boxes:[['AB','Local memory tag: the first letters identify the issuing area.'],['26','Age identifier: 26 means Mar–Aug 2026. Sep 2026–Feb 2027 uses 76.'],['CDE','Random letters completing the unique registration.'],['Yellow rear plate','Rear plates are yellow; front plates are white.']],note:'<strong>Age ✅ · Broad issuing area ✅</strong>.',foot:'Current style · since September 2001'},de:{cls:'de',plate:'<div class="plate"><div class="band"><span class="eu">✦✦✦</span><span class="countrymark">D</span></div><div class="mainnum">B · AB 1234</div></div>',boxes:[['B','Registration district: B = Berlin.'],['Seals','Official registration / inspection marks sit after the district code.'],['AB 1234','Vehicle-specific serial within that district.'],['D','Germany country identifier on the EU band.']],note:'<strong>Location ✅ · Age ❌</strong> — the opening code tells you the registration district.',foot:'German district-based system',geo:'de'},es:{cls:'es',plate:'<div class="plate"><div class="band"><span class="eu">✦✦✦</span><span class="countrymark">E</span></div><div class="mainnum">1234 BCD</div></div>',boxes:[['E','Spain / EU identifier.'],['1234','Four-number part of the national sequence.'],['BCD','Three-letter part of the national sequence.'],['No province code','Since 2000 ordinary plates no longer identify the province.']],note:'<strong>Province ❌ · Exact age ❌</strong> — nationwide sequential registration.',foot:'Current national system · since 2000'},it:{cls:'it',plate:'<div class="plate"><div class="band"><span class="countrymark">I</span></div><div class="mainnum">GA 123 BC</div><div class="band"><small>24</small><small>MI</small></div></div>',boxes:[['I','Italy / EU identifier.'],['GA 123 BC','National sequential registration; letters are not a province code.'],['24','Optional year marker may appear in the right band.'],['MI','Optional province abbreviation; MI = Milano.']],note:'<strong>Sometimes age/location ✅</strong> — optional right-band markings can add both.',foot:'Modern Italian national sequence'},be:{cls:'be',plate:'<div class="plate"><div class="band"><span class="countrymark">B</span></div><div class="mainnum">2-ABC-123</div></div>',boxes:[['B','Belgium identifier.'],['2','Leading index digit: part of the series.'],['ABC-123','Letters and digits complete the ordinary registration.'],['Red on white','Ordinary Belgian plates use distinctive red characters on white.']],note:'<strong>Age ❌ · Location ❌</strong>.',foot:'Belgian national registration system'},nl:{cls:'nl',plate:'<div class="plate"><div class="band"><span class="countrymark">NL</span></div><div class="mainnum">G-123-BC</div></div>',boxes:[['NL','Netherlands identifier.'],['G-123-BC','One of a succession of national “sidecode” formats.'],['Yellow plate','Ordinary passenger-car plates use black on yellow.'],['Sequence clue','Format can roughly suggest issue period, but is not a simple date code.']],note:'<strong>Exact age ❌ · Location ❌</strong>.',foot:'Dutch national registration system'},ch:{cls:'ch',plate:'<div class="plate"><div class="side">🇨🇭</div><div class="mainnum">ZH 123456</div><div class="side">🛡️</div></div>',boxes:[['ZH','Canton code: ZH = Zürich.'],['123456','Serial number issued within the canton.'],['Swiss shield','Swiss coat of arms appears on the plate.'],['Cantonal shield','The canton’s coat of arms appears at the other side.']],note:'<strong>Canton ✅ · Age ❌</strong> — the first letters identify the canton.',foot:'Swiss cantonal registration system',geo:'ch'}};
const geo={
ch:{title:'All 26 canton codes',source:'Swiss federal vehicle-registration rules',items:`AG|Aargau;AI|Appenzell Innerrhoden;AR|Appenzell Ausserrhoden;BE|Bern;BL|Basel-Landschaft;BS|Basel-Stadt;FR|Fribourg;GE|Geneva;GL|Glarus;GR|Graubünden;JU|Jura;LU|Luzern;NE|Neuchâtel;NW|Nidwalden;OW|Obwalden;SG|St Gallen;SH|Schaffhausen;SO|Solothurn;SZ|Schwyz;TG|Thurgau;TI|Ticino;UR|Uri;VD|Vaud;VS|Valais;ZG|Zug;ZH|Zürich`.split(';').map(x=>x.split('|'))},
fr:{title:'All French département identifiers',source:'French département numbering',items:`01|Ain;02|Aisne;03|Allier;04|Alpes-de-Haute-Provence;05|Hautes-Alpes;06|Alpes-Maritimes;07|Ardèche;08|Ardennes;09|Ariège;10|Aube;11|Aude;12|Aveyron;13|Bouches-du-Rhône;14|Calvados;15|Cantal;16|Charente;17|Charente-Maritime;18|Cher;19|Corrèze;2A|Corse-du-Sud;2B|Haute-Corse;21|Côte-d’Or;22|Côtes-d’Armor;23|Creuse;24|Dordogne;25|Doubs;26|Drôme;27|Eure;28|Eure-et-Loir;29|Finistère;30|Gard;31|Haute-Garonne;32|Gers;33|Gironde;34|Hérault;35|Ille-et-Vilaine;36|Indre;37|Indre-et-Loire;38|Isère;39|Jura;40|Landes;41|Loir-et-Cher;42|Loire;43|Haute-Loire;44|Loire-Atlantique;45|Loiret;46|Lot;47|Lot-et-Garonne;48|Lozère;49|Maine-et-Loire;50|Manche;51|Marne;52|Haute-Marne;53|Mayenne;54|Meurthe-et-Moselle;55|Meuse;56|Morbihan;57|Moselle;58|Nièvre;59|Nord;60|Oise;61|Orne;62|Pas-de-Calais;63|Puy-de-Dôme;64|Pyrénées-Atlantiques;65|Hautes-Pyrénées;66|Pyrénées-Orientales;67|Bas-Rhin;68|Haut-Rhin;69|Rhône;70|Haute-Saône;71|Saône-et-Loire;72|Sarthe;73|Savoie;74|Haute-Savoie;75|Paris;76|Seine-Maritime;77|Seine-et-Marne;78|Yvelines;79|Deux-Sèvres;80|Somme;81|Tarn;82|Tarn-et-Garonne;83|Var;84|Vaucluse;85|Vendée;86|Vienne;87|Haute-Vienne;88|Vosges;89|Yonne;90|Territoire de Belfort;91|Essonne;92|Hauts-de-Seine;93|Seine-Saint-Denis;94|Val-de-Marne;95|Val-d’Oise;971|Guadeloupe;972|Martinique;973|Guyane;974|La Réunion;976|Mayotte`.split(';').map(x=>x.split('|'))},
de:{title:'German registration-district codes',source:'ADAC / Kraftfahrt-Bundesamt — complete current directory linked below',items:[['A','Augsburg'],['B','Berlin'],['BN','Bonn'],['D','Düsseldorf'],['F','Frankfurt am Main'],['HH','Hamburg'],['K','Köln'],['L','Leipzig'],['M','München'],['MUC','München Stadt'],['MU','München Landkreis'],['S','Stuttgart']]}
};
const sel=document.getElementById('country');countries.forEach(c=>sel.add(new Option(`${flag(c.code)} ${c.name}`,c.code)));sel.value='fr';const geoBtn=document.getElementById('geoBtn'),geoEl=document.getElementById('geo'),geoSearch=document.getElementById('geoSearch');let currentGeo=null;
function box(x,i){return `<div class="callout"><b><span class="key ${i%2?'dark':'alt'}"></span>${x[0]}</b><span>${x[1]}</span></div>`}function paintCodes(q=''){if(!currentGeo)return;const g=geo[currentGeo];const s=q.trim().toLowerCase();const items=g.items.filter(x=>!s||x.join(' ').toLowerCase().includes(s));document.getElementById('codes').innerHTML=items.map(x=>`<div class="code"><strong>${x[0]}</strong>${x[1]}</div>`).join('')||'<div class="code">No matches</div>';}
function setGeo(k){geoEl.classList.remove('open');geoSearch.value='';currentGeo=k;if(!k||!geo[k]){geoBtn.hidden=true;return}const g=geo[k];geoBtn.hidden=false;geoBtn.textContent=k==='de'?'See geographic codes':'See all geographic codes';document.getElementById('geoTitle').textContent=g.title;document.getElementById('geoSource').innerHTML=k==='de'?`${g.source} · <a href="https://www.adac.de/rund-ums-fahrzeug/auto-kaufen-verkaufen/kfz-zulassung/kfz-kennzeichen-deutschland/" target="_blank" rel="noopener">Open all 700+ German codes ↗</a>`:g.source;paintCodes();}
function render(k){const c=countries.find(x=>x.code===k),d=data[k];document.getElementById('title').textContent=`${flag(k)} How a ${c.name} plate works`;const badge=document.getElementById('badge');if(d){badge.textContent='Verified detail';badge.className='badge';document.getElementById('diagram').className=`diagram ${d.cls}`;document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('bottomrow').innerHTML=d.boxes.slice(2,4).map((x,i)=>box(x,i+2)).join('');document.getElementById('plate').innerHTML=d.plate;document.getElementById('note').innerHTML=d.note;document.getElementById('footer').textContent=d.foot;setGeo(d.geo||null)}else{badge.textContent='Basic coverage';badge.className='badge basic';document.getElementById('diagram').className='diagram';document.getElementById('top').innerHTML=box(['Country',`${c.name} is in the global Platewise directory.`],0)+box(['Plate system','Exact ordinary-vehicle format still needs country-specific verification.'],1);document.getElementById('plate').innerHTML=`<div class="plate"><div class="band"><span class="countrymark">${flag(k)}</span></div><div class="mainnum">PLATE</div></div>`;document.getElementById('note').innerHTML='<strong>No invented decoding:</strong> age, location and serial meanings are only shown after verification.';document.getElementById('bottomrow').innerHTML=box(['Age','Not yet verified.'],2)+box(['Geography','Not yet verified.'],3);document.getElementById('footer').textContent='Basic entry · detailed decoding to be added';setGeo(null)}}
sel.addEventListener('change',()=>render(sel.value));geoBtn.addEventListener('click',()=>{geoEl.classList.toggle('open');geoBtn.textContent=geoEl.classList.contains('open')?'Hide geographic codes':(currentGeo==='de'?'See geographic codes':'See all geographic codes')});geoSearch.addEventListener('input',e=>paintCodes(e.target.value));render('fr');
</script></body></html>
