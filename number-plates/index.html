<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>Platewise — Understand number plates</title>
<style>:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 18px;display:grid;gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.1rem;font-weight:900}.brand span{color:var(--blue)}select,input,button{font:inherit}select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 34px 8px 12px;font-weight:750;max-width:230px}.intro{display:flex;justify-content:space-between;align-items:end;gap:8px}.intro h1{font-size:clamp(1.25rem,5.3vw,2rem);line-height:1;margin:0}.badge{font-size:.58rem;font-weight:850;text-transform:uppercase;border-radius:999px;padding:5px 7px;background:#e4f3ea;color:#176a42;white-space:nowrap}.badge.basic{background:#fff1cc;color:#765500}.diagram{border:1px solid #e1e3e4;background:#ffffffb8;border-radius:22px;padding:12px 9px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 9px;min-height:70px}.callout b{display:flex;gap:6px;font-size:.75rem;margin-bottom:2px}.callout span{display:block;color:var(--muted);font-size:.65rem;line-height:1.24}.key{width:8px;height:8px;border-radius:50%;background:#63788d;flex:0 0 auto;margin-top:3px}.key.dark{background:#111}.plate{width:100%;min-height:94px;border:4px solid #171717;border-radius:10px;box-shadow:0 6px 0 #c7c9cb,0 12px 22px #0002;display:flex;align-items:stretch;overflow:hidden;background:#fff;color:#111}.band{width:12%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.countrymark{font-size:1.25rem}.mainnum{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:900 clamp(1.45rem,8vw,4rem)/1 Arial,sans-serif;white-space:nowrap;padding:0 5px}.fr-right{width:12%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}.region-logo{width:26px;height:18px;border:1px solid #fff;border-radius:3px;display:grid;place-items:center;font-size:.42rem;font-weight:800}.deptnum{font:900 clamp(1.35rem,5vw,2.3rem)/1 Arial,sans-serif}.side{width:15%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:850;font-size:.65rem}.note{text-align:center;color:#39424a;font-size:.68rem;line-height:1.3;padding:0 6px}.note strong{color:var(--blue)}.uk .plate,.nl .plate{background:#f3c900}.be .plate{color:#a30d25}.dk .plate{border-color:#b40000}.geo-button{justify-self:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:800}.geo{border-top:1px solid var(--line);padding-top:10px;display:none}.geo.open{display:block}.geo-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.geo-search{width:155px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.7rem}.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:280px;overflow:auto}.code{background:#fff;border:1px solid #e2e5e7;border-radius:9px;padding:6px 7px;font-size:.64rem}.code strong{display:inline-block;min-width:2.3em;color:var(--blue)}.bottom{font-size:.67rem;color:var(--muted);text-align:center}</style></head>
<body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1><span id="badge" class="badge"></span></section><section class="diagram" id="diagram"><div class="row" id="top"></div><div><div id="plate"></div><div class="note" id="note"></div></div><div class="row" id="bottomrow"></div><button id="geoBtn" class="geo-button" hidden></button><section id="geo" class="geo"><div class="geo-head"><b id="geoTitle"></b><input id="geoSearch" class="geo-search" placeholder="Search code or place"></div><div id="codes" class="codes"></div></section></section><div class="bottom" id="footer"></div></main>
<script>
const raw=`AF|Afghanistan;AL|Albania;DZ|Algeria;AD|Andorra;AO|Angola;AG|Antigua and Barbuda;AR|Argentina;AM|Armenia;AU|Australia;AT|Austria;AZ|Azerbaijan;BS|Bahamas;BH|Bahrain;BD|Bangladesh;BB|Barbados;BY|Belarus;BE|Belgium;BZ|Belize;BJ|Benin;BT|Bhutan;BO|Bolivia;BA|Bosnia and Herzegovina;BW|Botswana;BR|Brazil;BN|Brunei;BG|Bulgaria;BF|Burkina Faso;BI|Burundi;CV|Cabo Verde;KH|Cambodia;CM|Cameroon;CA|Canada;CF|Central African Republic;TD|Chad;CL|Chile;CN|China;CO|Colombia;KM|Comoros;CR|Costa Rica;HR|Croatia;CU|Cuba;CY|Cyprus;CZ|Czechia;CI|Côte d’Ivoire;CD|DR Congo;DK|Denmark;DJ|Djibouti;DM|Dominica;DO|Dominican Republic;EC|Ecuador;EG|Egypt;SV|El Salvador;GQ|Equatorial Guinea;ER|Eritrea;EE|Estonia;SZ|Eswatini;ET|Ethiopia;FJ|Fiji;FI|Finland;FR|France;GA|Gabon;GM|Gambia;GE|Georgia;DE|Germany;GH|Ghana;GR|Greece;GD|Grenada;GT|Guatemala;GN|Guinea;GW|Guinea-Bissau;GY|Guyana;HT|Haiti;HN|Honduras;HU|Hungary;IS|Iceland;IN|India;ID|Indonesia;IR|Iran;IQ|Iraq;IE|Ireland;IL|Israel;IT|Italy;JM|Jamaica;JP|Japan;JO|Jordan;KZ|Kazakhstan;KE|Kenya;KI|Kiribati;KW|Kuwait;KG|Kyrgyzstan;LA|Laos;LV|Latvia;LB|Lebanon;LS|Lesotho;LR|Liberia;LY|Libya;LI|Liechtenstein;LT|Lithuania;LU|Luxembourg;MG|Madagascar;MW|Malawi;MY|Malaysia;MV|Maldives;ML|Mali;MT|Malta;MH|Marshall Islands;MR|Mauritania;MU|Mauritius;MX|Mexico;FM|Micronesia;MD|Moldova;MC|Monaco;MN|Mongolia;ME|Montenegro;MA|Morocco;MZ|Mozambique;MM|Myanmar;NA|Namibia;NR|Nauru;NP|Nepal;NL|Netherlands;NZ|New Zealand;NI|Nicaragua;NE|Niger;NG|Nigeria;KP|North Korea;MK|North Macedonia;NO|Norway;OM|Oman;PK|Pakistan;PW|Palau;PS|Palestine;PA|Panama;PG|Papua New Guinea;PY|Paraguay;PE|Peru;PH|Philippines;PL|Poland;PT|Portugal;QA|Qatar;CG|Republic of the Congo;RO|Romania;RU|Russia;RW|Rwanda;KN|Saint Kitts and Nevis;LC|Saint Lucia;VC|Saint Vincent and the Grenadines;WS|Samoa;SM|San Marino;ST|Sao Tome and Principe;SA|Saudi Arabia;SN|Senegal;RS|Serbia;SC|Seychelles;SL|Sierra Leone;SG|Singapore;SK|Slovakia;SI|Slovenia;SB|Solomon Islands;SO|Somalia;ZA|South Africa;KR|South Korea;SS|South Sudan;ES|Spain;LK|Sri Lanka;SD|Sudan;SR|Suriname;SE|Sweden;CH|Switzerland;SY|Syria;TJ|Tajikistan;TZ|Tanzania;TH|Thailand;TL|Timor-Leste;TG|Togo;TO|Tonga;TT|Trinidad and Tobago;TN|Tunisia;TM|Turkmenistan;TV|Tuvalu;TR|Türkiye;UG|Uganda;UA|Ukraine;AE|United Arab Emirates;GB|United Kingdom;US|United States;UY|Uruguay;UZ|Uzbekistan;VU|Vanuatu;VA|Vatican City;VE|Venezuela;VN|Vietnam;YE|Yemen;ZM|Zambia;ZW|Zimbabwe`;
const countries=raw.split(';').map(x=>{let [code,name]=x.split('|');return{code:code.toLowerCase(),name}}),flag=c=>c.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt()));
const p=(mark,num,extra='')=>`<div class="plate"><div class="band"><span class="countrymark">${mark}</span></div><div class="mainnum">${num}</div>${extra}</div>`;
const data={
fr:{plate:`<div class="plate"><div class="band"><span class="countrymark">F</span></div><div class="mainnum">AB-123-CD</div><div class="fr-right"><div class="region-logo">ÎDF</div><div class="deptnum">75</div></div></div>`,boxes:[['F','France identifier.'],['AB-123-CD','Chronological national serial; no date or place encoded.'],['Regional logo','Small emblem matching the chosen département.'],['75 · Paris','Owner-chosen département; not their home address.']],note:'<strong>Age ❌ · Home location ❌</strong>',foot:'SIV · since 2009'},
gb:{cls:'uk',plate:p('UK','AB 26 CDE'),boxes:[['AB','Issuing-area memory tag.'],['26','Age identifier: Mar–Aug 2026.'],['CDE','Random sequence.'],['Rear plate','Yellow; front is white.']],note:'<strong>Age ✅ · Broad issuing area ✅</strong>',foot:'Current style · since 2001'},
de:{plate:p('D','B · AB 1234'),boxes:[['B','Registration district: Berlin.'],['Seals','Registration and inspection seals.'],['AB 1234','Vehicle serial within district.'],['D','Germany identifier.']],note:'<strong>District ✅ · Age ❌</strong>',foot:'District-based system'},
es:{plate:p('E','1234 BCD'),boxes:[['E','Spain identifier.'],['1234','National sequence.'],['BCD','National letter sequence.'],['Province','Not encoded since 2000.']],note:'<strong>Province ❌ · Exact age ❌</strong>',foot:'National system · since 2000'},
it:{plate:p('I','GA 123 BC','<div class="band"><small>24</small><small>MI</small></div>'),boxes:[['I','Italy identifier.'],['GA 123 BC','National serial.'],['24','Optional year marker.'],['MI','Optional province: Milano.']],note:'<strong>Optional year/location markings</strong>',foot:'Italian national sequence'},
be:{cls:'be',plate:p('B','2-ABC-123'),boxes:[['B','Belgium identifier.'],['2','Series index.'],['ABC-123','Registration sequence.'],['Colour','Red characters on white.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Belgian national system'},
nl:{cls:'nl',plate:p('NL','G-123-BC'),boxes:[['NL','Netherlands identifier.'],['G-123-BC','National sidecode format.'],['Yellow','Passenger-car plate colour.'],['Format','Can roughly indicate issue period.']],note:'<strong>Location ❌ · Exact age ❌</strong>',foot:'Dutch national system'},
ch:{plate:`<div class="plate"><div class="side">🇨🇭</div><div class="mainnum">ZH 123456</div><div class="side">🛡️</div></div>`,boxes:[['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Swiss shield','National arms.'],['Cantonal shield','Canton arms.']],note:'<strong>Canton ✅ · Age ❌</strong>',foot:'Cantonal system'},
at:{plate:p('A','W 12345 A'),boxes:[['W','Registration district: Wien (Vienna).'],['12345','Serial digits.'],['A','Series character.'],['A / EU band','Austria identifier.']],note:'<strong>District ✅ · Age ❌</strong>',foot:'Austrian district system'},
bg:{plate:p('BG','CA 1234 AB'),boxes:[['CA','Regional code: Sofia.'],['1234','Serial digits.'],['AB','Series letters.'],['BG','Bulgaria identifier.']],note:'<strong>Region ✅ · Age ❌</strong>',foot:'Bulgarian regional system'},
hr:{plate:p('HR','ZG 1234-AB'),boxes:[['ZG','Registration area: Zagreb.'],['1234','Serial digits.'],['AB','Series letters.'],['HR','Croatia identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Croatian city/area system'},
cz:{plate:p('CZ','1AB 2345'),boxes:[['1AB','Series; second character identifies region.'],['A','A denotes Prague in the regional position.'],['2345','Serial digits.'],['CZ','Czechia identifier.']],note:'<strong>Region ✅ · Age ❌</strong>',foot:'Czech regional system'},
dk:{cls:'dk',plate:p('DK','AB 12 345'),boxes:[['DK','Denmark identifier.'],['AB','Serial letters.'],['12 345','Serial digits.'],['Red border','Characteristic Danish ordinary plate.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Danish national sequence'},
ee:{plate:p('EST','123 ABC'),boxes:[['EST','Estonia identifier.'],['123','Serial digits.'],['ABC','Serial letters.'],['Ordinary plate','National sequence; no locality encoded.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Estonian national system'},
fi:{plate:p('FIN','ABC-123'),boxes:[['FIN','Finland identifier.'],['ABC','Serial letters.'],['123','Serial digits.'],['Ordinary plate','No geographic code.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Finnish national system'},
gr:{plate:p('GR','ΙΒΧ-1234'),boxes:[['GR','Greece identifier.'],['ΙΒΧ','Greek letters visually compatible with Latin alphabet.'],['1234','Serial digits.'],['Series','Issuing series can relate to registration area.']],note:'<strong>Issuing area can be inferred from series</strong>',foot:'Greek registration system'},
hu:{plate:p('H','AA AA-123'),boxes:[['H','Hungary identifier.'],['AA AA','Four-letter sequence.'],['123','Serial digits.'],['New format','Introduced in 2022.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Current Hungarian system · since 2022'},
ie:{plate:p('IRL','261-D-12345'),boxes:[['261','Year + half-year: first half of 2026.'],['D','County/city: Dublin.'],['12345','Sequential registration.'],['IRL','Ireland identifier.']],note:'<strong>Age ✅ · Registration area ✅</strong>',foot:'Irish year/county system'},
lt:{plate:p('LT','ABC 123'),boxes:[['LT','Lithuania identifier.'],['ABC','Serial letters.'],['123','Serial digits.'],['Ordinary plate','No geographic meaning.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Lithuanian national system'},
no:{plate:p('N','AB 12345'),boxes:[['N','Norway identifier.'],['AB','Registration series tied to an issuing district.'],['12345','Serial digits.'],['Vehicle','Number normally stays with vehicle.']],note:'<strong>Issuing district clue ✅ · Age ❌</strong>',foot:'Norwegian registration system'},
pl:{plate:p('PL','WA 12345'),boxes:[['W','Voivodeship: Masovian.'],['A','Warsaw district code.'],['12345','Serial sequence.'],['PL','Poland identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Polish regional system'},
pt:{plate:p('P','AA-01-AA'),boxes:[['P','Portugal identifier.'],['AA','Series letters.'],['01','Serial digits.'],['Current format','No district or date encoded.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Current Portuguese system · since 2020'},
ro:{plate:p('RO','B 123 ABC'),boxes:[['B','County/area code: Bucharest.'],['123','Serial digits.'],['ABC','Series letters.'],['RO','Romania identifier.']],note:'<strong>County/area ✅ · Age ❌</strong>',foot:'Romanian county system'},
se:{plate:p('S','ABC 12D'),boxes:[['S','Sweden identifier.'],['ABC','National serial letters.'],['12D','Serial digits/letter.'],['No county','Modern plates do not encode county.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Swedish national system'},
sk:{plate:p('SK','AA 123AB'),boxes:[['AA','Series letters under current national system.'],['123','Serial digits.'],['AB','Final series letters.'],['SK','Slovakia identifier.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Current Slovak system · since 2023'},
si:{plate:p('SLO','LJ AB-123'),boxes:[['LJ','Registration area: Ljubljana.'],['AB-123','Vehicle serial.'],['SLO','Slovenia identifier.'],['Area','Opening code identifies registration area.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Slovenian regional system'},
rs:{plate:p('SRB','BG 123-AB'),boxes:[['BG','Registration area: Belgrade.'],['123','Serial digits.'],['AB','Series letters.'],['SRB','Serbia identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Serbian municipal system'},
me:{plate:p('MNE','PG AB123'),boxes:[['PG','Municipality: Podgorica.'],['AB123','Serial sequence.'],['MNE','Montenegro identifier.'],['Opening code','Identifies municipality.']],note:'<strong>Municipality ✅ · Age ❌</strong>',foot:'Montenegrin municipal system'}
};
const sel=document.getElementById('country');countries.forEach(c=>sel.add(new Option(`${flag(c.code)} ${c.name}`,c.code)));sel.value='fr';
const box=(x,i)=>`<div class="callout"><b><i class="key ${i%2?'dark':''}"></i>${x[0]}</b><span>${x[1]}</span></div>`;
function render(k){let c=countries.find(x=>x.code===k),d=data[k],badge=document.getElementById('badge');document.getElementById('title').textContent=`${flag(k)} How a ${c.name} plate works`;document.getElementById('geoBtn').hidden=true;document.getElementById('geo').className='geo';if(d){badge.textContent='Verified detail';badge.className='badge';document.getElementById('diagram').className=`diagram ${d.cls||''}`;document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('bottomrow').innerHTML=d.boxes.slice(2).map((x,i)=>box(x,i+2)).join('');document.getElementById('plate').innerHTML=d.plate;document.getElementById('note').innerHTML=d.note;document.getElementById('footer').textContent=d.foot}else{badge.textContent='Basic coverage';badge.className='badge basic';document.getElementById('top').innerHTML=box(['Country',`${c.name} is in the directory.`],0)+box(['Plate system','Detailed decoding not yet verified.'],1);document.getElementById('plate').innerHTML=p(flag(k),'PLATE');document.getElementById('note').innerHTML='<strong>No invented decoding.</strong>';document.getElementById('bottomrow').innerHTML=box(['Next step','Exact ordinary-car format needs verification.'],2)+box(['Coverage','Country selector only for now.'],3);document.getElementById('footer').textContent='Basic entry'}}sel.onchange=e=>render(e.target.value);render('fr');
</script></body></html>
