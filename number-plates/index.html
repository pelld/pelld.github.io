<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platewise — European number plates</title><style>:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 18px;display:grid;gap:9px}header,.intro{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.1rem;font-weight:900}.brand span{color:var(--blue)}select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:750;max-width:245px}.intro h1{font-size:clamp(1.25rem,5.3vw,2rem);line-height:1;margin:0}.badge{font-size:.56rem;font-weight:850;text-transform:uppercase;border-radius:999px;padding:5px 7px;background:#e6eef8;color:#174d7a;white-space:nowrap}.badge.appearance{background:#e4f3ea;color:#176a42}.diagram{border:1px solid #e1e3e4;background:#ffffffb8;border-radius:22px;padding:12px 9px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 9px;min-height:70px}.callout b{font-size:.75rem}.callout span{display:block;color:var(--muted);font-size:.65rem;line-height:1.24}.plate-stage{padding:8px 10px 2px}.plate{width:min(100%,520px);aspect-ratio:520/110;margin:auto;border:3px solid #171717;border-radius:6px;box-shadow:0 4px 0 #c7c9cb,0 8px 12px #0002;display:flex;align-items:stretch;overflow:hidden;background:#fff}.band{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.mainnum{flex:1;display:flex;align-items:center;justify-content:center;font:900 clamp(1.6rem,7.4vw,3.35rem)/1 Arial,sans-serif;white-space:nowrap}.fr-right{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column}.region-logo{font-size:.38rem}.deptnum{font:900 clamp(1.2rem,4.8vw,2rem)/1 Arial}.side{width:15%;display:grid;place-items:center}.note,.bottom{text-align:center;color:var(--muted);font-size:.68rem}.note strong{color:var(--blue)}.fi .plate{width:min(100%,442px);aspect-ratio:442/118;border-width:2px}.fi .mainnum{font-family:Arial Black,Arial;font-size:clamp(2.1rem,10.7vw,4.15rem)}.uk .plate{background:#f3c900}.uk .mainnum{font-family:Arial,sans-serif;font-size:clamp(1.9rem,8.8vw,3.7rem);letter-spacing:.04em}.at .plate{border:2px solid #c62026;box-shadow:inset 0 0 0 3px #fff,0 4px 0 #c7c9cb,0 8px 12px #0002}.at .mainnum{font-size:clamp(1.65rem,7.6vw,3.25rem)}.be .plate{color:#9e1732}.nl .plate{background:#f3c900}.dk .plate{border-color:#b40000}.geo-button{justify-self:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:800}.geo{display:none}.geo.open{display:block}.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;max-height:280px;overflow:auto}.code{background:#fff;border:1px solid #e2e5e7;border-radius:9px;padding:6px;font-size:.64rem}</style></head><body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1><span id="badge" class="badge"></span></section><section class="diagram" id="diagram"><div class="row" id="top"></div><div class="plate-stage"><div id="plate"></div></div><div class="note" id="note"></div><div class="row" id="bottomrow"></div><button id="geoBtn" class="geo-button" hidden>See geographic codes</button><section id="geo" class="geo"><div id="codes" class="codes"></div></section></section><div class="bottom" id="footer"></div></main><script>
const raw=`AT|Austria;BE|Belgium;BG|Bulgaria;HR|Croatia;CZ|Czechia;DK|Denmark;EE|Estonia;FI|Finland;FR|France;DE|Germany;GR|Greece;HU|Hungary;IE|Ireland;IT|Italy;LT|Lithuania;ME|Montenegro;NL|Netherlands;NO|Norway;PL|Poland;PT|Portugal;RO|Romania;RS|Serbia;SK|Slovakia;SI|Slovenia;ES|Spain;SE|Sweden;CH|Switzerland;GB|United Kingdom`;const countries=raw.split(';').map(x=>{let[a,b]=x.split('|');return{code:a.toLowerCase(),name:b}}),flag=c=>c.toUpperCase().replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt()));const p=(m,n,e='')=>`<div class="plate"><div class="band">${m}</div><div class="mainnum">${n}</div>${e}</div>`;
const A='Appearance checked',D='Decoded';const data={
fr:{cls:'fr',plate:`<div class="plate"><div class="band">F</div><div class="mainnum">AB-123-CD</div><div class="fr-right"><div class="region-logo">ÎDF</div><div class="deptnum">75</div></div></div>`,boxes:[['F','France identifier.'],['AB-123-CD','National serial; no date/place encoded.'],['Regional logo','Matches chosen département.'],['75 · Paris','Chosen département; not home address.']],note:'<strong>Age ❌ · Home location ❌</strong>',status:A},fi:{cls:'fi',plate:p('FIN','TRA-100'),boxes:[['FIN','Finland identifier.'],['TRA-100','Ordinary low EU car plate.'],['442 × 118 mm','Official dimensions.'],['Large characters','Distinctive tall lettering.']],note:'<strong>Location ❌ · Age ❌</strong>',status:A},de:{plate:p('D','B · AB 1234'),boxes:[['B','Berlin registration district.'],['Seals','Official seals after district code.'],['AB 1234','District serial.'],['520 × 110 mm','Normal maximum size.']],note:'<strong>District ✅ · Age ❌</strong>',status:A},be:{plate:p('B','2-ABC-123'),boxes:[['B','Belgium identifier.'],['2-ABC-123','Registration sequence.'],['Red on white','Characteristic colour.'],['520 × 110 mm','Normal format.']],note:'<strong>Age ❌ · Location ❌</strong>',status:A},es:{plate:p('E','1234 BCD'),boxes:[['E','Spain identifier.'],['1234 BCD','National sequence.'],['Characters','Official regulated geometry.'],['520 × 110 mm','Ordinary long plate.']],note:'<strong>Province ❌ · Exact age ❌</strong>',status:A},pt:{plate:p('P','AA 01 AA'),boxes:[['P','Portugal identifier.'],['AA 01 AA','Current sequence.'],['No date band','Removed in 2020.'],['520 × 110 mm','Official dimension.']],note:'<strong>Age ❌ · Location ❌</strong>',status:A},cz:{plate:p('CZ','1AB 2345'),boxes:[['CZ','Czechia identifier.'],['1AB 2345','Passenger-car sequence.'],['A','Regional position: Prague.'],['520 × 110 mm','Type 101.']],note:'<strong>Region ✅ · Age ❌</strong>',status:A},se:{plate:p('S','ABC 12D'),boxes:[['S','Sweden identifier.'],['ABC 12D','Current ordinary format.'],['White / black','Ordinary colours.'],['520 × 110 mm','Standard size.']],note:'<strong>Age ❌ · Location ❌</strong>',status:A},gb:{cls:'uk',plate:p('','AB 26 CDE'),boxes:[['AB','Local memory tag / first-registration area.'],['26','Age identifier: Mar–Aug 2026.'],['CDE','Random letters.'],['White / yellow','Front white; rear yellow.']],note:'<strong>Age ✅ · Broad issuing area ✅</strong>',status:A},at:{cls:'at',plate:p('A','W 12345 A'),boxes:[['W','Registration authority: Wien.'],['State arms','Real plates carry the relevant coat-of-arms badge.'],['12345 A','Serial portion.'],['Red edging','Austrian white plates have paired red border lines.']],note:'<strong>District ✅ · Age ❌</strong>',status:A},
it:{plate:p('I','GA 123 BC'),boxes:[['I','Italy identifier.'],['GA 123 BC','National serial.'],['Right band','Can show optional year/province.'],['Status','Appearance pass pending.']],note:'<strong>Sometimes age/location shown</strong>',status:D},nl:{cls:'nl',plate:p('NL','G-123-BC'),boxes:[['NL','Netherlands identifier.'],['G-123-BC','National sidecode.'],['Yellow','Passenger-car colour.'],['Status','Appearance pass pending.']],note:'<strong>Location ❌ · Exact age ❌</strong>',status:D},ch:{plate:p('🇨🇭','ZH 123456'),boxes:[['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Shields','National and canton arms.'],['Status','Appearance pass pending.']],note:'<strong>Canton ✅ · Age ❌</strong>',status:D},bg:{plate:p('BG','CA 1234 AB'),boxes:[['CA','Sofia regional code.'],['1234','Digits.'],['AB','Series.'],['Status','Appearance pass pending.']],note:'<strong>Region ✅ · Age ❌</strong>',status:D},hr:{plate:p('HR','ZG 1234-AB'),boxes:[['ZG','Zagreb area.'],['1234','Digits.'],['AB','Series.'],['Status','Appearance pass pending.']],note:'<strong>Area ✅ · Age ❌</strong>',status:D},dk:{cls:'dk',plate:p('DK','AB 12 345'),boxes:[['DK','Denmark identifier.'],['AB','Letters.'],['12 345','Digits.'],['Red border','Characteristic feature.']],note:'<strong>Age ❌ · Location ❌</strong>',status:D},ee:{plate:p('EST','123 ABC'),boxes:[['EST','Estonia identifier.'],['123','Digits.'],['ABC','Letters.'],['Status','Appearance pass pending.']],note:'<strong>Age ❌ · Location ❌</strong>',status:D},gr:{plate:p('GR','ΙΒΧ-1234'),boxes:[['GR','Greece identifier.'],['ΙΒΧ','Greek series letters.'],['1234','Digits.'],['Status','Appearance pass pending.']],note:'<strong>Area may be inferred</strong>',status:D},hu:{plate:p('H','AA AA-123'),boxes:[['H','Hungary identifier.'],['AA AA','Four letters.'],['123','Digits.'],['2022','Current format introduced.']],note:'<strong>Age ❌ · Location ❌</strong>',status:D},ie:{plate:p('IRL','261-D-12345'),boxes:[['261','Year + half-year.'],['D','Dublin.'],['12345','Sequence.'],['Status','Appearance pass pending.']],note:'<strong>Year ✅ · Area ✅</strong>',status:D},lt:{plate:p('LT','ABC 123'),boxes:[['LT','Lithuania identifier.'],['ABC','Letters.'],['123','Digits.'],['Status','Appearance pass pending.']],note:'<strong>Age ❌ · Location ❌</strong>',status:D},no:{plate:p('N','AB 12345'),boxes:[['AB','Registration-office allocation.'],['12345','Digits.'],['N','Norway identifier.'],['Status','Appearance pass pending.']],note:'<strong>Area clue ✅ · Age ❌</strong>',status:D},pl:{plate:p('PL','WA 12345'),boxes:[['W','Masovian voivodeship.'],['A','Local code.'],['12345','Serial.'],['Status','Appearance pass pending.']],note:'<strong>Area ✅ · Age ❌</strong>',status:D},ro:{plate:p('RO','B 123 ABC'),boxes:[['B','Bucharest.'],['123','Digits.'],['ABC','Letters.'],['Status','Appearance pass pending.']],note:'<strong>County ✅ · Age ❌</strong>',status:D},rs:{plate:p('SRB','BG 123-AA'),boxes:[['BG','Belgrade.'],['123','Digits.'],['AA','Letters.'],['Status','Appearance pass pending.']],note:'<strong>Area ✅ · Age ❌</strong>',status:D},me:{plate:p('MNE','PG AA123'),boxes:[['PG','Podgorica.'],['AA','Letters.'],['123','Digits.'],['Status','Appearance pass pending.']],note:'<strong>Municipality ✅ · Age ❌</strong>',status:D},sk:{plate:p('SK','BA 123AB'),boxes:[['BA','Bratislava district.'],['123AB','Sequence.'],['SK','Slovakia identifier.'],['Status','Appearance pass pending.']],note:'<strong>District ✅ · Age ❌</strong>',status:D},si:{plate:p('SLO','LJ AB-123'),boxes:[['LJ','Ljubljana area.'],['AB-123','Sequence.'],['Crest','Local arms on real plate.'],['Status','Appearance pass pending.']],note:'<strong>Area ✅ · Age ❌</strong>',status:D}};
const sel=document.getElementById('country');countries.forEach(c=>sel.add(new Option(`${flag(c.code)} ${c.name}`,c.code)));sel.value='fr';const box=x=>`<div class="callout"><b>${x[0]}</b><span>${x[1]}</span></div>`;function render(k){const c=countries.find(x=>x.code===k),d=data[k];document.getElementById('title').textContent=`${flag(k)} How a ${c.name} plate works`;const b=document.getElementById('badge');b.textContent=d.status;b.className='badge '+(d.status===A?'appearance':'');document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('plate').innerHTML=d.plate;document.getElementById('bottomrow').innerHTML=d.boxes.slice(2).map(box).join('');document.getElementById('note').innerHTML=d.note;document.getElementById('diagram').className='diagram '+(d.cls||'');document.getElementById('footer').textContent=d.status==='Appearance checked'?'Official-source appearance pass complete':'Registration logic decoded; physical appearance still being verified'}sel.onchange=e=>render(e.target.value);render('fr');</script></body></html>
