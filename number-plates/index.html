<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>Platewise — European number plates</title>
<style>:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 18px;display:grid;gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.1rem;font-weight:900}.brand span{color:var(--blue)}select,input,button{font:inherit}select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 34px 8px 12px;font-weight:750;max-width:245px}.intro{display:flex;justify-content:space-between;align-items:end;gap:8px}.intro h1{font-size:clamp(1.25rem,5.3vw,2rem);line-height:1;margin:0}.badge{font-size:.56rem;font-weight:850;text-transform:uppercase;border-radius:999px;padding:5px 7px;background:#e6eef8;color:#174d7a;white-space:nowrap}.badge.appearance{background:#e4f3ea;color:#176a42}.diagram{border:1px solid #e1e3e4;background:#ffffffb8;border-radius:22px;padding:12px 9px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 9px;min-height:70px}.callout b{display:flex;gap:6px;font-size:.75rem;margin-bottom:2px}.callout span{display:block;color:var(--muted);font-size:.65rem;line-height:1.24}.key{width:8px;height:8px;border-radius:50%;background:#63788d;flex:0 0 auto;margin-top:3px}.key.dark{background:#111}.plate-stage{padding:8px 10px 2px}.plate{width:min(100%,520px);aspect-ratio:520/110;margin:0 auto;border:3px solid #171717;border-radius:7px;box-shadow:0 4px 0 #c7c9cb,0 8px 12px #0002;display:flex;align-items:stretch;overflow:hidden;background:#fff;color:#111}.band{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.countrymark{font-size:clamp(1rem,4.4vw,1.65rem)}.mainnum{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:900 clamp(1.6rem,7.4vw,3.35rem)/1 Arial,sans-serif;white-space:nowrap;padding:0 5px}.fr-right{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.region-logo{width:23px;height:15px;border:1px solid #fff;border-radius:2px;display:grid;place-items:center;font-size:.36rem;font-weight:800}.deptnum{font:900 clamp(1.2rem,4.8vw,2rem)/1 Arial,sans-serif}.side{width:15%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:850;font-size:.65rem}.note{text-align:center;color:#39424a;font-size:.68rem;line-height:1.3;padding:7px 6px 0}.note strong{color:var(--blue)}.uk .plate,.nl .plate{background:#f3c900}.be .plate{color:#a30d25}.dk .plate{border-color:#b40000}.fi .plate{width:min(100%,442px);aspect-ratio:442/118;border-radius:5px;border-width:2px}.fi .band{width:12.8%}.fi .mainnum{font-family:Arial Black,Arial,sans-serif;font-size:clamp(2.15rem,10.8vw,4.2rem);font-weight:900;letter-spacing:.015em}.fi .countrymark{font-size:clamp(.82rem,3.4vw,1.2rem)}.geo-button{justify-self:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:800}.geo{border-top:1px solid var(--line);padding-top:10px;display:none}.geo.open{display:block}.geo-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.geo-search{width:155px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.7rem}.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:280px;overflow:auto}.code{background:#fff;border:1px solid #e2e5e7;border-radius:9px;padding:6px 7px;font-size:.64rem}.code strong{display:inline-block;min-width:2.3em;color:var(--blue)}.bottom{font-size:.67rem;color:var(--muted);text-align:center}</style></head>
<body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country" aria-label="European country"></select></header><section class="intro"><h1 id="title"></h1><span id="badge" class="badge"></span></section><section class="diagram" id="diagram"><div class="row" id="top"></div><div><div class="plate-stage"><div id="plate"></div></div><div class="note" id="note"></div></div><div class="row" id="bottomrow"></div><button id="geoBtn" class="geo-button" hidden></button><section id="geo" class="geo"><div class="geo-head"><b id="geoTitle"></b><input id="geoSearch" class="geo-search" placeholder="Search code or place"></div><div id="codes" class="codes"></div></section></section><div class="bottom" id="footer"></div></main>
<script>
const raw=`AT|Austria;BE|Belgium;BG|Bulgaria;HR|Croatia;CZ|Czechia;DK|Denmark;EE|Estonia;FI|Finland;FR|France;DE|Germany;GR|Greece;HU|Hungary;IE|Ireland;IT|Italy;LT|Lithuania;ME|Montenegro;NL|Netherlands;NO|Norway;PL|Poland;PT|Portugal;RO|Romania;RS|Serbia;SK|Slovakia;SI|Slovenia;ES|Spain;SE|Sweden;CH|Switzerland;GB|United Kingdom`;
const countries=raw.split(';').map(x=>{let [code,name]=x.split('|');return{code:code.toLowerCase(),name}}),flag=c=>c.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt()));
const p=(mark,num,extra='')=>`<div class="plate"><div class="band"><span class="countrymark">${mark}</span></div><div class="mainnum">${num}</div>${extra}</div>`;
const data={
fr:{plate:`<div class="plate"><div class="band"><span class="countrymark">F</span></div><div class="mainnum">AB-123-CD</div><div class="fr-right"><div class="region-logo">ÎDF</div><div class="deptnum">75</div></div></div>`,boxes:[['F','France identifier.'],['AB-123-CD','Chronological national serial; no date or place encoded.'],['Regional logo','Small emblem matching the chosen département.'],['75 · Paris','Owner-chosen département; not their home address.']],note:'<strong>Age ❌ · Home location ❌</strong>',foot:'SIV · since 2009',geo:'fr',status:'Decoded'},
fi:{cls:'fi',plate:p('FIN','TRA-100'),boxes:[['FIN','Finland identifier in the EU band.'],['TRA-100','Three letters and up to three digits on the ordinary low EU car plate.'],['118 × 442 mm','Official dimensions of the low EU car plate.'],['Large characters','Finnish characters occupy noticeably more of the plate height than on many 520 mm European plates.']],note:'<strong>Location ❌ · Age ❌</strong>',foot:'Low EU car plate · official Traficom dimensions 118 × 442 mm',status:'Appearance checked'},
gb:{cls:'uk',plate:p('UK','AB 26 CDE'),boxes:[['AB','Issuing-area memory tag.'],['26','Age identifier: Mar–Aug 2026.'],['CDE','Random sequence.'],['Rear plate','Yellow; front is white.']],note:'<strong>Age ✅ · Broad issuing area ✅</strong>',foot:'Current style · since 2001',status:'Decoded'},
de:{plate:p('D','B · AB 1234'),boxes:[['B','Registration district: Berlin.'],['Seals','Registration and inspection seals.'],['AB 1234','Vehicle serial within district.'],['D','Germany identifier.']],note:'<strong>District ✅ · Age ❌</strong>',foot:'District-based system',geo:'de',status:'Decoded'},
es:{plate:p('E','1234 BCD'),boxes:[['E','Spain identifier.'],['1234','National sequence.'],['BCD','National letter sequence.'],['Province','Not encoded since 2000.']],note:'<strong>Province ❌ · Exact age ❌</strong>',foot:'National system · since 2000',status:'Decoded'},
it:{plate:p('I','GA 123 BC','<div class="band"><small>24</small><small>MI</small></div>'),boxes:[['I','Italy identifier.'],['GA 123 BC','National serial.'],['24','Optional year marker.'],['MI','Optional province: Milano.']],note:'<strong>Sometimes age/location encoded</strong>',foot:'Italian national sequence',status:'Decoded'},
be:{cls:'be',plate:p('B','2-ABC-123'),boxes:[['B','Belgium identifier.'],['2','Series index.'],['ABC-123','Registration sequence.'],['Colour','Red characters on white.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Belgian national system',status:'Decoded'},
nl:{cls:'nl',plate:p('NL','G-123-BC'),boxes:[['NL','Netherlands identifier.'],['G-123-BC','National sidecode format.'],['Yellow','Passenger-car plate colour.'],['Format','Can roughly indicate issue period.']],note:'<strong>Location ❌ · Exact age ❌</strong>',foot:'Dutch national system',status:'Decoded'},
ch:{plate:`<div class="plate"><div class="side">🇨🇭</div><div class="mainnum">ZH 123456</div><div class="side">🛡️</div></div>`,boxes:[['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Swiss shield','National arms.'],['Cantonal shield','Canton arms.']],note:'<strong>Canton ✅ · Age ❌</strong>',foot:'Cantonal system',geo:'ch',status:'Decoded'},
at:{plate:p('A','W 12345 A'),boxes:[['W','Registration district: Wien (Vienna).'],['12345','Serial digits.'],['A','Series character.'],['A','Austria identifier.']],note:'<strong>District ✅ · Age ❌</strong>',foot:'Austrian district system',status:'Decoded'},
bg:{plate:p('BG','CA 1234 AB'),boxes:[['CA','Regional code: Sofia.'],['1234','Serial digits.'],['AB','Series letters.'],['BG','Bulgaria identifier.']],note:'<strong>Region ✅ · Age ❌</strong>',foot:'Bulgarian regional system',status:'Decoded'},
hr:{plate:p('HR','ZG 1234-AB'),boxes:[['ZG','Registration area: Zagreb.'],['1234','Serial digits.'],['AB','Series letters.'],['HR','Croatia identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Croatian city/area system',status:'Decoded'},
cz:{plate:p('CZ','1AB 2345'),boxes:[['1AB','Series; second character identifies region.'],['A','A denotes Prague in the regional position.'],['2345','Serial digits.'],['CZ','Czechia identifier.']],note:'<strong>Region ✅ · Age ❌</strong>',foot:'Czech regional system',status:'Decoded'},
dk:{cls:'dk',plate:p('DK','AB 12 345'),boxes:[['DK','Denmark identifier.'],['AB','Serial letters.'],['12 345','Serial digits.'],['Red border','Characteristic Danish ordinary plate.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Danish national sequence',status:'Decoded'},
ee:{plate:p('EST','123 ABC'),boxes:[['EST','Estonia identifier.'],['123','Serial digits.'],['ABC','Serial letters.'],['Ordinary plate','National sequence; no locality encoded.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Estonian national system',status:'Decoded'},
gr:{plate:p('GR','ΙΒΧ-1234'),boxes:[['GR','Greece identifier.'],['ΙΒΧ','Greek letters visually compatible with Latin alphabet.'],['1234','Serial digits.'],['Series','Issuing series can relate to registration area.']],note:'<strong>Issuing area can be inferred from series</strong>',foot:'Greek registration system',status:'Decoded'},
hu:{plate:p('H','AA AA-123'),boxes:[['H','Hungary identifier.'],['AA AA','Four-letter sequence.'],['123','Serial digits.'],['New format','Introduced in 2022.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Current format · since 2022',status:'Decoded'},
ie:{plate:p('IRL','261-D-12345'),boxes:[['261','Year + half-year: first half of 2026.'],['D','County/city: Dublin.'],['12345','Sequential number.'],['IRL','Ireland identifier.']],note:'<strong>Year ✅ · Registration area ✅</strong>',foot:'Irish year/county system',status:'Decoded'},
lt:{plate:p('LT','ABC 123'),boxes:[['LT','Lithuania identifier.'],['ABC','Serial letters.'],['123','Serial digits.'],['Current system','Letters no longer indicate region.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Lithuanian national system',status:'Decoded'},
no:{plate:p('N','AB 12345'),boxes:[['AB','Letter pair linked to registration-office allocation.'],['12345','Serial digits.'],['N','Norway identifier.'],['Sequence','Does not directly encode vehicle age.']],note:'<strong>Allocation-area clue ✅ · Age ❌</strong>',foot:'Norwegian registration system',status:'Decoded'},
pl:{plate:p('PL','WA 12345'),boxes:[['W','Voivodeship: Masovian.'],['A','Local district/city code.'],['12345','Serial.'],['PL','Poland identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Polish regional system',status:'Decoded'},
pt:{plate:p('P','AA-01-AA'),boxes:[['P','Portugal identifier.'],['AA','Serial letters.'],['01','Serial digits.'],['Current format','No district or registration date shown.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Current format · since 2020',status:'Decoded'},
ro:{plate:p('RO','B 123 ABC'),boxes:[['B','County/municipality: Bucharest.'],['123','Serial digits.'],['ABC','Serial letters.'],['RO','Romania identifier.']],note:'<strong>County ✅ · Age ❌</strong>',foot:'Romanian county system',status:'Decoded'},
rs:{plate:p('SRB','BG 123-AA'),boxes:[['BG','Registration area: Belgrade.'],['123','Serial digits.'],['AA','Series letters.'],['SRB','Serbia identifier.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Serbian regional system',status:'Decoded'},
me:{plate:p('MNE','PG AA123'),boxes:[['PG','Municipality: Podgorica.'],['AA','Series letters.'],['123','Serial digits.'],['MNE','Montenegro identifier.']],note:'<strong>Municipality ✅ · Age ❌</strong>',foot:'Montenegrin municipal system',status:'Decoded'},
sk:{plate:p('SK','BA 123AB'),boxes:[['BA','District code: Bratislava.'],['123AB','Serial sequence.'],['SK','Slovakia identifier.'],['Format','District-based registration.']],note:'<strong>District ✅ · Age ❌</strong>',foot:'Slovak district system',status:'Decoded'},
si:{plate:p('SLO','LJ AB-123'),boxes:[['LJ','Registration area: Ljubljana.'],['AB-123','Serial sequence.'],['SLO','Slovenia identifier.'],['Crest','Local coat of arms appears on real plates.']],note:'<strong>Registration area ✅ · Age ❌</strong>',foot:'Slovenian regional system',status:'Decoded'},
se:{plate:p('S','ABC 12D'),boxes:[['S','Sweden identifier.'],['ABC','Serial letters.'],['12D','Serial continuation.'],['No locality','Registration is nationally allocated.']],note:'<strong>Age ❌ · Location ❌</strong>',foot:'Swedish national system',status:'Decoded'}
};
const geo={fr:`01|Ain;02|Aisne;03|Allier;04|Alpes-de-Haute-Provence;05|Hautes-Alpes;06|Alpes-Maritimes;07|Ardèche;08|Ardennes;09|Ariège;10|Aube;11|Aude;12|Aveyron;13|Bouches-du-Rhône;14|Calvados;15|Cantal;16|Charente;17|Charente-Maritime;18|Cher;19|Corrèze;2A|Corse-du-Sud;2B|Haute-Corse;21|Côte-d'Or;22|Côtes-d'Armor;23|Creuse;24|Dordogne;25|Doubs;26|Drôme;27|Eure;28|Eure-et-Loir;29|Finistère;30|Gard;31|Haute-Garonne;32|Gers;33|Gironde;34|Hérault;35|Ille-et-Vilaine;36|Indre;37|Indre-et-Loire;38|Isère;39|Jura;40|Landes;41|Loir-et-Cher;42|Loire;43|Haute-Loire;44|Loire-Atlantique;45|Loiret;46|Lot;47|Lot-et-Garonne;48|Lozère;49|Maine-et-Loire;50|Manche;51|Marne;52|Haute-Marne;53|Mayenne;54|Meurthe-et-Moselle;55|Meuse;56|Morbihan;57|Moselle;58|Nièvre;59|Nord;60|Oise;61|Orne;62|Pas-de-Calais;63|Puy-de-Dôme;64|Pyrénées-Atlantiques;65|Hautes-Pyrénées;66|Pyrénées-Orientales;67|Bas-Rhin;68|Haut-Rhin;69|Rhône;70|Haute-Saône;71|Saône-et-Loire;72|Sarthe;73|Savoie;74|Haute-Savoie;75|Paris;76|Seine-Maritime;77|Seine-et-Marne;78|Yvelines;79|Deux-Sèvres;80|Somme;81|Tarn;82|Tarn-et-Garonne;83|Var;84|Vaucluse;85|Vendée;86|Vienne;87|Haute-Vienne;88|Vosges;89|Yonne;90|Territoire de Belfort;91|Essonne;92|Hauts-de-Seine;93|Seine-Saint-Denis;94|Val-de-Marne;95|Val-d'Oise;971|Guadeloupe;972|Martinique;973|Guyane;974|La Réunion;976|Mayotte`,ch:`AG|Aargau;AI|Appenzell Innerrhoden;AR|Appenzell Ausserrhoden;BE|Bern;BL|Basel-Landschaft;BS|Basel-Stadt;FR|Fribourg;GE|Geneva;GL|Glarus;GR|Graubünden;JU|Jura;LU|Luzern;NE|Neuchâtel;NW|Nidwalden;OW|Obwalden;SG|St Gallen;SH|Schaffhausen;SO|Solothurn;SZ|Schwyz;TG|Thurgau;TI|Ticino;UR|Uri;VD|Vaud;VS|Valais;ZG|Zug;ZH|Zürich`,de:`B|Berlin;M|München;K|Köln;F|Frankfurt am Main;HH|Hamburg;S|Stuttgart;D|Düsseldorf;DO|Dortmund;H|Hannover;N|Nürnberg;L|Leipzig;DD|Dresden;HB|Bremen;KI|Kiel;MA|Mannheim;KA|Karlsruhe;AC|Aachen;BN|Bonn;BO|Bochum;MS|Münster;WI|Wiesbaden`};
const sel=document.getElementById('country');countries.forEach(c=>sel.add(new Option(`${flag(c.code)} ${c.name}`,c.code)));sel.value='fr';const box=(x,i)=>`<div class="callout"><b><span class="key ${i%2?'dark':''}"></span>${x[0]}</b><span>${x[1]}</span></div>`;
function render(k){let c=countries.find(x=>x.code===k),d=data[k],badge=document.getElementById('badge'),btn=document.getElementById('geoBtn'),g=document.getElementById('geo');document.getElementById('title').textContent=`${flag(k)} How a ${c.name} plate works`;g.classList.remove('open');badge.textContent=d.status;badge.className=d.status==='Appearance checked'?'badge appearance':'badge';document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('plate').innerHTML=d.plate;document.getElementById('bottomrow').innerHTML=d.boxes.slice(2).map((x,i)=>box(x,i+2)).join('');document.getElementById('note').innerHTML=d.note;document.getElementById('footer').textContent=d.foot;document.getElementById('diagram').className=`diagram ${d.cls||''}`;btn.hidden=!d.geo;if(d.geo){btn.textContent='See geographic codes';document.getElementById('geoTitle').textContent=k==='fr'?'Département codes':k==='ch'?'All 26 cantons':'Common German district codes';showCodes(d.geo,'')}}
function showCodes(k,q){let items=geo[k].split(';').map(x=>x.split('|')).filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('codes').innerHTML=items.map(x=>`<div class="code"><strong>${x[0]}</strong>${x[1]}</div>`).join('')};sel.onchange=e=>render(e.target.value);document.getElementById('geoBtn').onclick=()=>document.getElementById('geo').classList.toggle('open');document.getElementById('geoSearch').oninput=e=>{let d=data[sel.value];if(d?.geo)showCodes(d.geo,e.target.value)};render('fr');
</script></body></html>
