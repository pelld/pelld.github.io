<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platewise — European number plates</title><style>
:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 20px;display:grid;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.15rem;font-weight:900}.brand span{color:var(--blue)}select{border:2px solid #171717;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;max-width:260px}.intro h1{font-size:clamp(1.35rem,5.5vw,2rem);line-height:1.05;margin:2px 0}.diagram{border:1px solid #e0e3e5;background:#ffffffb8;border-radius:22px;padding:12px 10px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;min-height:72px}.callout b{font-size:.78rem}.callout span{display:block;color:var(--muted);font-size:.66rem;line-height:1.27;margin-top:3px}.stage{padding:9px 5px;min-height:118px;display:grid;place-items:center}.plate-img{display:block;max-width:100%;max-height:150px;width:auto;height:auto;margin:auto}.plate-source{display:block;text-align:center;font-size:.58rem;color:var(--muted);margin-top:5px}.plate{--w:520;--h:110;width:min(100%,calc(var(--w)*1px));aspect-ratio:var(--w)/var(--h);margin:auto;background:#fff;border:2.5px solid #151515;border-radius:5px;box-shadow:0 4px 0 #c8c8c8,0 8px 12px #0002;display:flex;align-items:stretch;overflow:hidden;color:#111;position:relative}.eu{width:11%;background:#0751ad;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:4px 0;font:bold clamp(.48rem,2vw,.8rem) Arial}.stars{color:#ffd52a;font-size:.55rem}.num{flex:1;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:800 clamp(1.7rem,8vw,3.5rem)/1 Arial,sans-serif;letter-spacing:.02em;padding:0 4px}.right{width:11%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.seal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #777;font-size:.38rem;margin:0 3px}.note{text-align:center;font-size:.72rem;color:#234e7d;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:.66rem}.yellow{background:#f4cf13}.redtext{color:#9c1734}.black{background:#111;color:#eee;border-color:#ddd}.blueText{color:#174b91}.redborder{box-shadow:inset 0 0 0 2px #c9232c,inset 0 0 0 5px #fff,0 4px 0 #c8c8c8,0 8px 12px #0002}.micro{--w:360;--h:120}.din .num{font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:.04em}.ukrear{background:#f4cf13}.ireland:after{content:'BAILE ÁTHA CLIATH';position:absolute;top:5px;left:0;right:0;text-align:center;font:bold clamp(.35rem,1.4vw,.55rem) Arial}.italyR{background:#0751ad;color:#fff;font-size:.48rem}.frR{background:#0751ad;color:#fff;gap:2px}.frR small{font-size:.38rem}.frR strong{font-size:1.25rem}.lux{background:#f0d529}.dk{box-shadow:inset 0 0 0 2px #b51f29,0 4px 0 #c8c8c8,0 8px 12px #0002}@media(max-width:380px){.callout{min-height:68px}.num{font-size:clamp(1.45rem,7.5vw,3rem)}}
</style></head><body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1></section><section class="diagram"><div class="row" id="top"></div><div class="stage" id="stage"></div><div class="note" id="note"></div><div class="row" id="bottom"></div></section><div class="footer">Current ordinary passenger-car plate</div></main><script>
const F=c=>c.toUpperCase().replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt()));
const EU=(cc,n,cls='',right='')=>`<div class="plate ${cls}"><div class="eu"><span class="stars">••••••</span><b>${cc}</b></div><div class="num">${n}</div>${right}</div>`;
const P=(n,cls='')=>`<div class="plate ${cls}"><div class="num">${n}</div></div>`;
const IMG=(src,alt,filePage)=>`<div><img class="plate-img" src="${src}" alt="${alt}"><a class="plate-source" href="${filePage}" target="_blank" rel="noopener">Wikimedia Commons source</a></div>`;
const E=(code,name,plate,a,b,c,d,note)=>({code,name,plate,boxes:[a,b,c,d],note});
const D=[
E('al','Albania',EU('AL','AB 123 CD','din','<div class="right">🇦🇱</div>'),['AB','Registration district/series prefix.'],['123','Serial digits.'],['CD','Serial letters.'],['Blue bands','Current European-style Albanian plate.'],'Geography can be encoded'),
E('ad','Andorra',P('A1234','micro blueText'),['A1234','National serial.'],['Crest','Andorran coat of arms appears on the plate.'],['AND','Country identifier.'],['Compact format','Distinctive smaller plate.'],'Age ❌ · Location ❌'),
E('at','Austria',EU('A','W 12345 A','redborder din'),['W','Registration authority: Vienna.'],['12345 A','Local serial.'],['Coat of arms','Authority/state emblem separates the groups.'],['Red lines','Distinctive paired red edging.'],'District ✅ · Age ❌'),
E('by','Belarus',P('1234 AB-7','din'),['1234 AB','Serial.'],['7','Registration region code.'],['BY','Country identifier.'],['Flag','National flag appears on the plate.'],'Region ✅ · Age ❌'),
E('be','Belgium',EU('B','2-ABC-123','redtext'),['2','Series index.'],['ABC-123','Registration serial.'],['Red characters','Belgian ordinary plates use dark red characters.'],['EU band','B country identifier.'],'Age ❌ · Location ❌'),
E('ba','Bosnia and Herzegovina',EU('','A12-B-345','din'),['A12-B-345','National serial.'],['Letters','Restricted character set works in both scripts.'],['Blue band','European-style band.'],['No locality','Modern sequence is national.'],'Age ❌ · Location ❌'),
E('bg','Bulgaria',EU('BG','CA 1234 AB','din'),['CA','Sofia regional code.'],['1234','Serial digits.'],['AB','Series letters.'],['EU band','BG identifier.'],'Region ✅ · Age ❌'),
E('hr','Croatia',EU('HR','ZG 1234 AB','din'),['ZG','Zagreb registration area.'],['1234 AB','Local serial.'],['Crest','Croatian arms separate the groups.'],['EU band','HR identifier.'],'Area ✅ · Age ❌'),
E('cy','Cyprus',EU('CY','ABC 123','din'),['ABC 123','National serial.'],['EU band','CY identifier.'],['White plate','Current ordinary plate is white reflective.'],['No district code','Locality is not encoded.'],'Age ❌ · Location ❌'),
E('cz','Czechia',EU('CZ','1AB 2345','din'),['1AB 2345','Ordinary passenger format.'],['A','Regional character: Prague in this example.'],['EU band','CZ identifier.'],['Format','Normal long passenger plate.'],'Region ✅ · Age ❌'),
E('dk','Denmark',EU('DK','AB 12 345','dk din'),['AB 12 345','National serial.'],['Red edging','Characteristic Danish border.'],['EU band','Optional; shown here.'],['White/black','Ordinary passenger plate.'],'Age ❌ · Location ❌'),
E('ee','Estonia',EU('EST','123 ABC','din'),['123','Serial digits.'],['ABC','Serial letters.'],['EU band','EST identifier.'],['National system','No locality encoded.'],'Age ❌ · Location ❌'),
E('fi','Finland',IMG('https://commons.wikimedia.org/wiki/Special:FilePath/Finnish_license_plate.svg','Current Finnish ordinary registration plate','https://commons.wikimedia.org/wiki/File:Finnish_license_plate.svg'),['FIN','Finland identifier below the EU stars.'],['ABC-123','Ordinary registration format.'],['Actual plate artwork','Using the Commons SVG rather than a CSS recreation.'],['What it tells you','The number does not encode age or locality.'],'Location ❌ · Age ❌'),
E('fr','France',`<div class="plate din"><div class="eu"><span class="stars">••••••</span><b>F</b></div><div class="num">AB-123-CD</div><div class="right frR"><small>ÎDF</small><strong>75</strong></div></div>`,['F','France / EU identifier.'],['AB-123-CD','Chronological SIV serial; not a date code.'],['75','Owner-chosen département: Paris.'],['Regional mark','Must correspond to chosen département.'],'Age ❌ · Home location ❌'),
E('de','Germany',EU('D','B · AB 1234','din'),['B','Registration district: Berlin.'],['Seals','Official seals appear after district code.'],['AB 1234','Local serial.'],['EU band','D identifier.'],'District ✅ · Age ❌'),
E('gr','Greece',EU('GR','ΙΒΧ-1234','din'),['ΙΒΧ','Series letters; issuing area can be inferred.'],['1234','Serial digits.'],['Greek letters','Only forms visually shared with Latin are used.'],['EU band','GR identifier.'],'Issuing-area clue ✅ · Age ❌'),
E('hu','Hungary',EU('H','AA AA-123','din'),['AA AA','Four-letter current series.'],['123','Serial digits.'],['Emblem','Small Hungarian arms separate groups.'],['2022 system','Current format began in 2022.'],'Age ❌ · Location ❌'),
E('is','Iceland',P('AB C12','din'),['AB C12','National registration serial.'],['Flag + IS','Country identifier at left.'],['White/black','Ordinary passenger plate.'],['National system','No current locality code.'],'Age ❌ · Location ❌'),
E('ie','Ireland',EU('IRL','261-D-12345','ireland din'),['261','2026, first half of year.'],['D','Dublin code.'],['12345','Sequential registration number.'],['Irish county name','Shown above the registration.'],'Year ✅ · County ✅'),
E('it','Italy',`<div class="plate din"><div class="eu"><b>I</b></div><div class="num">GA 123 BC</div><div class="right italyR"><small>24</small><small>MI</small></div></div>`,['GA 123 BC','National serial.'],['Left band','EU + I identifier.'],['24','Optional year marker.'],['MI','Optional province abbreviation.'],'Optional year/province can be shown'),
E('xk','Kosovo',P('01 123 AB','din'),['01','Pristina district code.'],['123 AB','Serial.'],['RKS','Kosovo identifier.'],['Flag','Kosovo flag appears at left.'],'District ✅ · Age ❌'),
E('lv','Latvia',EU('LV','AB-1234','din'),['AB','Series letters.'],['1234','Serial digits.'],['EU band','LV identifier.'],['National sequence','No locality encoded.'],'Age ❌ · Location ❌'),
E('li','Liechtenstein',P('FL 12345','black din'),['FL','Fürstentum Liechtenstein.'],['12345','National serial.'],['Black plate','White/silver characters on black.'],['Crest','Princely arms appear at left.'],'Age ❌ · Location ❌'),
E('lt','Lithuania',EU('LT','ABC 123','din'),['ABC','Serial letters.'],['123','Serial digits.'],['EU band','LT identifier.'],['National sequence','Current plates do not encode region.'],'Age ❌ · Location ❌'),
E('lu','Luxembourg',EU('L','AB 1234','lux din'),['AB 1234','National serial.'],['Yellow background','Ordinary plates are yellow.'],['EU band','L identifier.'],['Compact serial','Typically two letters + four digits.'],'Age ❌ · Location ❌'),
E('mt','Malta',EU('M','ABC 123','din'),['ABC','Letter series.'],['123','Serial digits.'],['EU band','M identifier.'],['Front/rear','Front white; rear yellow.'],'Age ❌ · Location generally ❌'),
E('md','Moldova',P('ABC 123','din'),['ABC 123','Current national serial.'],['MD','Moldova identifier.'],['Flag','Moldovan flag at left.'],['White/black','Ordinary plate.'],'Age ❌ · Location ❌'),
E('mc','Monaco',P('1234 A','micro blueText din'),['1234 A','Monegasque serial.'],['Crest','Monaco arms at left.'],['MC','Country identifier.'],['Compact plate','Distinctive small format.'],'Age ❌ · Location ❌'),
E('me','Montenegro',P('PG AA 123','din'),['PG','Podgorica municipality.'],['AA 123','Local serial.'],['Crest','National crest separates groups.'],['MNE','Country identifier.'],'Municipality ✅ · Age ❌'),
E('nl','Netherlands',EU('NL','G-123-BC','yellow din'),['G-123-BC','A current sidecode pattern.'],['Yellow background','Standard passenger-car colour.'],['Black border','Characteristic frame.'],['EU band','NL identifier.'],'Age ❌ · Location ❌'),
E('mk','North Macedonia',P('SK 1234 AB','din'),['SK','Skopje registration area.'],['1234 AB','Local serial.'],['NMK','International identifier.'],['Flag','National flag at left.'],'Area ✅ · Age ❌'),
E('no','Norway',P('AB 12345','din'),['AB','Registration-office allocation.'],['12345','Serial digits.'],['N','Norway identifier.'],['White/black','Ordinary passenger plate.'],'Allocation-area clue ✅ · Age ❌'),
E('pl','Poland',EU('PL','WA 12345','din'),['W','Masovian voivodeship.'],['A','Warsaw/local code.'],['12345','Serial.'],['EU band','PL identifier.'],'Registration area ✅ · Age ❌'),
E('pt','Portugal',EU('P','AA 01 AA','din'),['AA 01 AA','Current national sequence.'],['No yellow date band','Removed in 2020.'],['EU band','P identifier.'],['Format','Ordinary long plate.'],'Age ❌ · Location ❌'),
E('ro','Romania',EU('RO','B 123 ABC','din'),['B','Bucharest code.'],['123 ABC','Local serial.'],['EU band','RO identifier.'],['White/black','Ordinary passenger plate.'],'County/city ✅ · Age ❌'),
E('ru','Russia',P('A123BC 77','din'),['A123BC','Vehicle serial.'],['77','Moscow region code.'],['RUS + flag','Country identifier at right.'],['White/black','Ordinary private vehicle plate.'],'Region ✅ · Age ❌'),
E('sm','San Marino',P('A1234','micro blueText din'),['A1234','National serial.'],['Crest','San Marino arms.'],['Blue characters','Distinctive plate styling.'],['Compact plate','Smaller format.'],'Age ❌ · Location ❌'),
E('rs','Serbia',P('BG 123-AA','din'),['BG','Belgrade area.'],['123-AA','Local serial.'],['Crest','Serbian arms separate groups.'],['SRB','Country identifier.'],'Area ✅ · Age ❌'),
E('sk','Slovakia',EU('SK','AA 123AA','din'),['AA','Current national series.'],['123AA','Serial continuation.'],['2023 change','No longer encodes district.'],['EU band','SK identifier.'],'Location ❌ · Age ❌'),
E('si','Slovenia',EU('SLO','LJ AB-123','din'),['LJ','Ljubljana area.'],['AB-123','Serial.'],['Crest','Local arms appear between groups.'],['Green edging','Characteristic border.'],'Area ✅ · Age ❌'),
E('es','Spain',EU('E','1234 BCD','din'),['1234','National digits.'],['BCD','National letter series.'],['EU band','E identifier.'],['National system','Province is not encoded.'],'Province ❌ · Exact age ❌'),
E('se','Sweden',EU('S','ABC 12D','din'),['ABC 12D','Current ordinary format.'],['EU band','S identifier.'],['White/black','Ordinary passenger plate.'],['National sequence','No locality encoded.'],'Age ❌ · Location ❌'),
E('ch','Switzerland',P('ZH 123456','din'),['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Swiss shield','National arms at left.'],['Cantonal shield','Canton arms at right.'],'Canton ✅ · Age ❌'),
E('tr','Türkiye',P('34 ABC 123','din'),['34','Istanbul province code.'],['ABC 123','Local serial.'],['TR','Country identifier at left.'],['White/black','Ordinary private vehicle plate.'],'Province ✅ · Age ❌'),
E('ua','Ukraine',P('AA 1234 BB','din'),['AA','Kyiv city region code.'],['1234 BB','Serial.'],['UA + flag','Country identifier at left.'],['White/black','Ordinary passenger plate.'],'Region ✅ · Age ❌'),
E('gb','United Kingdom',P('AB26 CDE','ukrear din'),['AB','First-registration area memory tag.'],['26','Age identifier: Mar–Aug 2026.'],['CDE','Random letters.'],['Rear yellow','Rear shown; front is white.'],'Age ✅ · First-registration area ✅'),
E('va','Vatican City',P('CV 12345','micro din'),['CV','Civil Vatican prefix.'],['12345','Serial digits.'],['SCV','Official/state vehicles use SCV.'],['Compact white plate','Black characters with Vatican emblem.'],'Age ❌ · Location ❌')];
D.sort((a,b)=>a.name.localeCompare(b.name));const sel=document.getElementById('country');D.forEach(d=>sel.add(new Option(`${F(d.code==='xk'?'xk':d.code)} ${d.name}`,d.code)));sel.value='fi';const box=x=>`<div class="callout"><b>${x[0]}</b><span>${x[1]}</span></div>`;function render(k){const d=D.find(x=>x.code===k);document.getElementById('title').textContent=`${F(k==='xk'?'xk':k)} How a ${d.name} plate works`;document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('stage').innerHTML=d.plate;document.getElementById('bottom').innerHTML=d.boxes.slice(2).map(box).join('');document.getElementById('note').textContent=d.note}sel.onchange=e=>render(e.target.value);render('fi');
</script></body></html>
