<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>Platewise — Understand number plates</title>
<style>:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 18px;display:grid;gap:9px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.1rem;font-weight:900}.brand span{color:var(--blue)}select,input,button{font:inherit}select{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 34px 8px 12px;font-weight:750;max-width:230px}.intro{display:flex;justify-content:space-between;align-items:end;gap:8px}.intro h1{font-size:clamp(1.25rem,5.3vw,2rem);line-height:1;margin:0}.badge{font-size:.58rem;font-weight:850;text-transform:uppercase;border-radius:999px;padding:5px 7px;background:#e4f3ea;color:#176a42;white-space:nowrap}.badge.basic{background:#fff1cc;color:#765500}.diagram{border:1px solid #e1e3e4;background:#ffffffb8;border-radius:22px;padding:12px 9px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px 9px;min-height:70px}.callout b{display:flex;gap:6px;font-size:.75rem;margin-bottom:2px}.callout span{display:block;color:var(--muted);font-size:.65rem;line-height:1.24}.key{width:8px;height:8px;border-radius:50%;background:#63788d;flex:0 0 auto;margin-top:3px}.key.dark{background:#111}.plate-stage{padding:8px 10px 2px}.plate{width:min(100%,520px);aspect-ratio:520/110;min-height:0;margin:0 auto;border:3px solid #171717;border-radius:8px;box-shadow:0 4px 0 #c7c9cb,0 8px 12px #0002;display:flex;align-items:stretch;overflow:hidden;background:#fff;color:#111}.band{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.countrymark{font-size:clamp(1rem,4.4vw,1.65rem)}.mainnum{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font:900 clamp(1.6rem,7.4vw,3.35rem)/1 Arial,sans-serif;white-space:nowrap;padding:0 5px}.fr-right{width:11.5%;background:#0645a3;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.region-logo{width:23px;height:15px;border:1px solid #fff;border-radius:2px;display:grid;place-items:center;font-size:.36rem;font-weight:800}.deptnum{font:900 clamp(1.2rem,4.8vw,2rem)/1 Arial,sans-serif}.side{width:15%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-weight:850;font-size:.65rem}.note{text-align:center;color:#39424a;font-size:.68rem;line-height:1.3;padding:7px 6px 0;position:relative;z-index:2;background:#fff0}.note strong{color:var(--blue)}.uk .plate,.nl .plate{background:#f3c900}.be .plate{color:#a30d25}.dk .plate{border-color:#b40000}.geo-button{justify-self:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.7rem;font-weight:800}.geo{border-top:1px solid var(--line);padding-top:10px;display:none}.geo.open{display:block}.geo-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.geo-search{width:155px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:.7rem}.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;max-height:280px;overflow:auto}.code{background:#fff;border:1px solid #e2e5e7;border-radius:9px;padding:6px 7px;font-size:.64rem}.code strong{display:inline-block;min-width:2.3em;color:var(--blue)}.bottom{font-size:.67rem;color:var(--muted);text-align:center}</style></head>
<body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1><span id="badge" class="badge"></span></section><section class="diagram" id="diagram"><div class="row" id="top"></div><div><div class="plate-stage"><div id="plate"></div></div><div class="note" id="note"></div></div><div class="row" id="bottomrow"></div><button id="geoBtn" class="geo-button" hidden></button><section id="geo" class="geo"><div class="geo-head"><b id="geoTitle"></b><input id="geoSearch" class="geo-search" placeholder="Search code or place"></div><div id="codes" class="codes"></div></section></section><div class="bottom" id="footer"></div></main>

rica;KR|South Korea;SS|South Sudan;ES|Spain;LK|Sri Lanka;SD|Sudan;SR|Suriname;SE|Sweden;CH|Switzerland;SY|Syria;TJ|Tajikistan;TZ|Tanzania;TH|Thailand;TL|Timor-Leste;TG|Togo;TO|Tonga;TT|Trinidad and Tobago;TN|Tunisia;TM|Turkmenistan;TV|Tuvalu;TR|Türkiye;UG|Uganda;UA|Ukraine;AE|United Arab Emirates;GB|United Kingdom;US|United States;UY|Uruguay;UZ|Uzbekistan;VU|Vanuatu;VA|Vatican City;VE|Venezuela;VN|Vietnam;YE|Yemen;ZM|Zambia;ZW|Zimbabwe`;
const countries=raw.split(';').map(x=>{let [code,name]=x.split('|');return{code:code.toLowerCase(),name}}),flag=c=>c.toUpperCase().replace(/./g,ch=>String.fromCodePoint(127397+ch.charCodeAt()));
const p=(mark,num,extra='')=>`<div class="plate"><div class="band"><span class="countrymark">${mark}</span></div><div class="mainnum">${num}</div>${extra}</div>`;
const data={

};
const geo={fr:`01|Ain;02|Aisne;03|Allier;04|Alpes-de-Haute-Provence;05|Hautes-Alpes;06|Alpes-Maritimes;07|Ardèche;08|Ardennes;09|Ariège;10|Aube;11|Aude;12|Aveyron;13|Bouches-du-Rhône;14|Calvados;15|Cantal;16|Charente;17|Charente-Maritime;18|Cher;19|Corrèze;2A|Corse-du-Sud;2B|Haute-Corse;21|Côte-d'Or;22|Côtes-d'Armor;23|Creuse;24|Dordogne;25|Doubs;26|Drôme;27|Eure;28|Eure-et-Loir;29|Finistère;30|Gard;31|Haute-Garonne;32|Gers;33|Gironde;34|Hérault;35|Ille-et-Vilaine;36|Indre;37|Indre-et-Loire;38|Isère;39|Jura;40|Landes;41|Loir-et-Cher;42|Loire;43|Haute-Loire;44|Loire-Atlantique;45|Loiret;46|Lot;47|Lot-et-Garonne;48|Lozère;49|Maine-et-Loire;50|Manche;51|Marne;52|Haute-Marne;53|Mayenne;54|Meurthe-et-Moselle;55|Meuse;56|Morbihan;57|Moselle;58|Nièvre;59|Nord;60|Oise;61|Orne;62|Pas-de-Calais;63|Puy-de-Dôme;64|Pyrénées-Atlantiques;65|Hautes-Pyrénées;66|Pyrénées-Orientales;67|Bas-Rhin;68|Haut-Rhin;69|Rhône;70|Haute-Saône;71|Saône-et-Loire;72|Sarthe;73|Savoie;74|Haute-Savoie;75|Paris;76|Seine-Maritime;77|Seine-et-Marne;78|Yvelines;79|Deux-Sèvres;80|Somme;81|Tarn;82|Tarn-et-Garonne;83|Var;84|Vaucluse;85|Vendée;86|Vienne;87|Haute-Vienne;88|Vosges;89|Yonne;90|Territoire de Belfort;91|Essonne;92|Hauts-de-Seine;93|Seine-Saint-Denis;94|Val-de-Marne;95|Val-d'Oise;971|Guadeloupe;972|Martinique;973|Guyane;974|La Réunion;976|Mayotte`,ch:`AG|Aargau;AI|Appenzell Innerrhoden;AR|Appenzell Ausserrhoden;BE|Bern;BL|Basel-Landschaft;BS|Basel-Stadt;FR|Fribourg;GE|Geneva;GL|Glarus;GR|Graubünden;JU|Jura;LU|Luzern;NE|Neuchâtel;NW|Nidwalden;OW|Obwalden;SG|St Gallen;SH|Schaffhausen;SO|Solothurn;SZ|Schwyz;TG|Thurgau;TI|Ticino;UR|Uri;VD|Vaud;VS|Valais;ZG|Zug;ZH|Zürich`,de:`B|Berlin;M|München;K|Köln;F|Frankfurt am Main;HH|Hamburg;S|Stuttgart;D|Düsseldorf;DO|Dortmund;H|Hannover;N|Nürnberg;L|Leipzig;DD|Dresden;HB|Bremen;KI|Kiel;MA|Mannheim;KA|Karlsruhe;AC|Aachen;BN|Bonn;BO|Bochum;MS|Münster;WI|Wiesbaden`};
['fr','de','ch'].forEach(k=>data[k].geo=k);const sel=document.getElementById('country');countries.forEach(c=>sel.add(new Option(`${flag(c.code)} ${c.name}`,c.code)));sel.value='fr';const box=(x,i)=>`<div class="callout"><b><span class="key ${i%2?'dark':''}"></span>${x[0]}</b><span>${x[1]}</span></div>`;
function render(k){let c=countries.find(x=>x.code===k),d=data[k],badge=document.getElementById('badge'),btn=document.getElementById('geoBtn'),g=document.getElementById('geo');document.getElementById('title').textContent=`${flag(k)} How a ${c.name} plate works`;g.classList.remove('open');if(!d){badge.textContent='Basic coverage';badge.className='badge basic';document.getElementById('top').innerHTML=box(['Country',`${c.name} is in Platewise.`],0)+box(['Status','Exact ordinary-vehicle format not yet verified.'],1);document.getElementById('plate').innerHTML=p(flag(k),'PLATE');document.getElementById('bottomrow').innerHTML=box(['Age','Not yet decoded.'],2)+box(['Location','Not yet decoded.'],3);document.getElementById('note').innerHTML='No invented decoding.';document.getElementById('footer').textContent='Basic coverage';btn.hidden=true;return}badge.textContent='Verified detail';badge.className='badge';document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('plate').innerHTML=d.plate;document.getElementById('bottomrow').innerHTML=d.boxes.slice(2).map((x,i)=>box(x,i+2)).join('');document.getElementById('note').innerHTML=d.note;document.getElementById('footer').textContent=d.foot;document.getElementById('diagram').className=`diagram ${d.cls||''}`;btn.hidden=!d.geo;if(d.geo){btn.textContent='See geographic codes';document.getElementById('geoTitle').textContent=k==='fr'?'Département codes':k==='ch'?'All 26 cantons':'Common German district codes';showCodes(d.geo,'')}}
function showCodes(k,q){let items=geo[k].split(';').map(x=>x.split('|')).filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('codes').innerHTML=items.map(x=>`<div class="code"><strong>${x[0]}</strong>${x[1]}</div>`).join('')};sel.onchange=e=>render(e.target.value);document.getElementById('geoBtn').onclick=()=>document.getElementById('geo').classList.toggle('open');document.getElementById('geoSearch').oninput=e=>{let d=data[sel.value];if(d?.geo)showCodes(d.geo,e.target.value)};render('fr');
</script></body></html>
