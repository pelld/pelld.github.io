<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platewise — European number plates</title><style>:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 20px;display:grid;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.15rem;font-weight:900}.brand span{color:var(--blue)}select{border:2px solid #171717;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;max-width:260px}.intro h1{font-size:clamp(1.35rem,5.5vw,2rem);line-height:1.05;margin:2px 0}.diagram{border:1px solid #e0e3e5;background:#ffffffb8;border-radius:22px;padding:12px 10px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;min-height:72px}.callout b{font-size:.78rem}.callout span{display:block;color:var(--muted);font-size:.66rem;line-height:1.27;margin-top:3px}.stage{padding:9px 5px}.plate{--w:520;--h:110;width:min(100%,calc(var(--w)*1px));aspect-ratio:var(--w)/var(--h);margin:auto;background:#fff;border:2.5px solid #151515;border-radius:5px;box-shadow:0 4px 0 #c8c8c8,0 8px 12px #0002;display:flex;align-items:stretch;overflow:hidden;color:#111;position:relative}.eu{width:11%;background:#0751ad;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:4px 0;font:bold clamp(.48rem,2vw,.8rem) Arial}.stars{color:#ffd52a;font-size:.55rem;letter-spacing:-2px}.num{flex:1;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:800 clamp(1.7rem,8vw,3.5rem)/1 Arial,sans-serif;letter-spacing:.02em;padding:0 4px}.right{width:11%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:900}.seal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #777;font-size:.38rem;margin:0 3px}.note{text-align:center;font-size:.72rem;color:#234e7d;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:.66rem}.yellow{background:#f4cf13}.redtext{color:#9c1734}.black{background:#111;color:#eee;border-color:#ddd}.blueText{color:#174b91}.redborder{box-shadow:inset 0 0 0 2px #c9232c,inset 0 0 0 5px #fff,0 4px 0 #c8c8c8,0 8px 12px #0002}.double{padding:5px;box-shadow:0 4px 0 #c8c8c8,0 8px 12px #0002}.double:after{content:"";position:absolute;inset:5px;border:2px solid #222;border-radius:3px;pointer-events:none;z-index:10}.small{--w:442;--h:118}.micro{--w:360;--h:120}.tallchars .num{font-family:"Arial Narrow",Arial,sans-serif;font-weight:900;font-size:clamp(2rem,10vw,4.25rem);letter-spacing:-.015em}.din .num{font-family:"Arial Narrow",Arial,sans-serif;letter-spacing:.04em}.ukfront{background:#fff}.ukrear{background:#f4cf13}.ireland:after{content:'BAILE ÁTHA CLIATH';position:absolute;top:5px;left:0;right:0;text-align:center;font:bold clamp(.35rem,1.4vw,.55rem) Arial}.italyR{background:#0751ad;color:#fff;font-size:.48rem}.frR{background:#0751ad;color:#fff;gap:2px}.frR small{font-size:.38rem}.frR strong{font-size:1.25rem}.swiss .num{font-weight:700}.lux{background:#f0d529}.dk{box-shadow:inset 0 0 0 2px #b51f29,0 4px 0 #c8c8c8,0 8px 12px #0002}.hr .num,.si .num{font-size:clamp(1.45rem,7vw,3rem)}@media(max-width:380px){.callout{min-height:68px}.num{font-size:clamp(1.45rem,7.5vw,3rem)}}</style></head><body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1></section><section class="diagram"><div class="row" id="top"></div><div class="stage" id="stage"></div><div class="note" id="note"></div><div class="row" id="bottom"></div></section><div class="footer" id="footer">Current ordinary const EU=(cc,n,cls='',right='')=>`<div class="plate ${cls}"><div class="eu"><span class="stars">••••••</span><b>${cc}</b></div><div class="num">${n}</div>${right}</div>`;
const P=(n,cls='')=>`<div class="plate ${cls}"><div class="num">${n}</div></div>`;
const E=(code,name,plate,a,b,c,d,note)=>({code,name,plate,boxes:[[a[0],a[1]],[b[0],b[1]],[c[0],c[1]],[d[0],d[1]]],note});
const D=[
E('al','Albania',EU('AL','AB 123 CD','din','<div class="right">🇦🇱</div>'),['AB','Registration district/series prefix.'],['123','Serial digits.'],['CD','Serial letters.'],['Blue bands','Current European-style Albanian plate.'],'Geography can be encoded'),
E('ad','Andorra',`<div class="plate micro blueText"><div class="right">🛡️</div><div class="num">A1234</div><div class="right"><small>AND</small></div></div>`,['A1234','National serial.'],['Crest','Andorran coat of arms.'],['AND','Country identifier.'],['Small plate','Distinctive compact format.'],'Age ❌ · Location ❌'),
E('at','Austria',EU('A','W 12345 A','redborder din','<div class="right">⚜</div>'),['W','Registration authority: Vienna.'],['12345 A','Local serial.'],['Coat of arms','Authority/state emblem appears between groups.'],['Red lines','Distinctive paired red edging.'],'District ✅ · Age ❌'),
E('by','Belarus',`<div class="plate"><div class="right">🇧🇾<small>BY</small></div><div class="num">1234 AB-7</div></div>`,['1234 AB','Serial.'],['7','Registration region code.'],['BY','Belarus identifier.'],['Flag','National flag at left.'],'Region ✅ · Age ❌'),
E('be','Belgium',EU('B','2-ABC-123','redtext'),['2','Series index.'],['ABC-123','Registration serial.'],['Red characters','Belgian plates use dark red characters.'],['EU band','B country identifier.'],'Age ❌ · Location ❌'),
E('ba','Bosnia and Herzegovina',EU('','A12-B-345','din'),['A12-B-345','National serial.'],['Letters','Restricted set works across Latin/Cyrillic scripts.'],['Blue band','European-style band.'],['No locality','Modern sequence is national.'],'Age ❌ · Location ❌'),
E('bg','Bulgaria',EU('BG','CA 1234 AB','din'),['CA','Sofia registration code.'],['1234','Serial digits.'],['AB','Series letters.'],['EU band','BG identifier.'],'Region ✅ · Age ❌'),
E('hr','Croatia',EU('HR','ZG 1234 AB','hr din','<div class="right">▣</div>'),['ZG','Zagreb registration area.'],['1234 AB','Local serial.'],['Crest','Croatian coat of arms separates groups.'],['EU band','HR identifier.'],'Area ✅ · Age ❌'),
E('cy','Cyprus',EU('CY','ABC 123','din'),['ABC 123','National serial.'],['EU band','CY identifier.'],['White plate','Current plates are white reflective.'],['No district code','Locality is not encoded.'],'Age ❌ · Location ❌'),
E('cz','Czechia',EU('CZ','1AB 2345','din'),['1AB 2345','Ordinary passenger format.'],['A','Regional character: Prague in this example.'],['EU band','CZ identifier.'],['520 × 110','Normal long format.'],'Region ✅ · Age ❌'),
E('dk','Denmark',EU('DK','AB 12 345','dk din'),['AB 12 345','National serial.'],['Red edging','Characteristic Danish border.'],['EU band','Optional on Danish plates; shown here.'],['White/black','Ordinary passenger plate.'],'Age ❌ · Location ❌'),
E('ee','Estonia',EU('EST','123 ABC','din'),['123','Serial digits.'],['ABC','Serial letters.'],['EU band','EST identifier.'],['National system','Ordinary sequence does not encode locality.'],'Age ❌ · Location ❌'),
E('fi','Finland',`<div class="plate small double tallchars"><div class="eu"><span class="stars">••••••</span><b>FIN</b></div><div class="num">TRA-100</div></div>`,['FIN','Finland identifier below EU stars.'],['TRA-100','Ordinary randomly assigned registration.'],['442 × 118 mm','Finnish low EU car plate.'],['72 mm characters','Tall, heavy Finnish lettering.'],'Location ❌ · Age ❌'),
E('fr','France',`<div class="plate din"><div class="eu"><span class="stars">••••••</span><b>F</b></div><div class="num">AB-123-CD</div><div class="right frR"><small>ÎDF</small><strong>75</strong></div></div>`,['F','France / EU identifier.'],['AB-123-CD','Chronological SIV serial; not a date code.'],['75','Owner-chosen département: Paris.'],['Regional mark','Logo must correspond to chosen département.'],'Age ❌ · Home location ❌'),
E('de','Germany',`<div class="plate din"><div class="eu"><span class="stars">••••••</span><b>D</b></div><div class="num">B <span class="seal">●</span> AB 1234</div></div>`,['B','Registration district: Berlin.'],['Seals','Official registration/inspection seals.'],['AB 1234','Local serial.'],['EU band','D identifier.'],'District ✅ · Age ❌'),
E('gr','Greece',EU('GR','ΙΒΧ-1234','din'),['ΙΒΧ','Series letters; issuing area can be inferred.'],['1234','Serial digits.'],['Greek letters','Only forms visually shared with Latin are used.'],['EU band','GR identifier.'],'Issuing area clue ✅ · Age ❌'),

E('is','Iceland',`<div class="plate din"><div class="right">🇮🇸<small>IS</small></div><div class="num">AB C12</div></div>`,['AB C12','National registration serial.'],['Flag + IS','Icelandic identifier at left.'],['White/black','Ordinary passenger plate.'],['National system','No current locality code.'],'Age ❌ · Location ❌'),
E('ie','Ireland',`<div class="plate ireland din"><div class="eu"><span class="stars">••••••</span><b>IRL</b></div><div class="num">261-D-12345</div></div>`,['261','2026, first half of year.'],['D','Dublin city/county code.'],['12345','Sequential registration number.'],['Irish county name','County name appears in Irish above the number.'],'Year ✅ · County ✅'),
E('it','Italy',`<div class="plate din"><div class="eu"><span class="stars">••••••</span><b>I</b></div><div class="num">GA 123 BC</div><div class="right italyR"><small>24</small><small>MI</small></div></div>`,['GA 123 BC','National serial.'],['Left band','EU + I identifier.'],['24','Optional registration-year marker.'],['MI','Optional province abbreviation.'],'Optional year/province can be displayed'),

E('lt','Lithuania',EU('LT','ABC 123','din'),['ABC','Serial letters.'],['123','Serial digits.'],['EU band','LT identifier.'],['National sequence','Current ordinary plates do not encode region.'],'Age ❌ · Location ❌'),
E('lu','Luxembourg',EU('L','AB 1234','lux din'),['AB 1234','National serial.'],['Yellow background','Ordinary Luxembourg plates are yellow.'],['EU band','L identifier.'],['Compact serial','Typically two letters + four digits.'],'Age ❌ · Location ❌'),
E('mt','Malta',EU('M','ABC 123','din'),['ABC','Letters; first can identify vehicle category/use.'],['123','Serial digits.'],['EU band','M identifier.'],['Front/rear','Front white; rear yellow on ordinary cars.'],'Age ❌ · Location generally ❌'),
E('md','Moldova',`<div class="plate din"><div class="right">🇲🇩<small>MD</small></div><div class="num">ABC 123</div></div>`,['ABC 123','Current national serial.'],['MD','Moldova identifier.'],['Flag','Moldovan flag at left.'],['White/black','Ordinary plate.'],'Age ❌ · Location ❌'),
E('mc','Monaco',`<div class="plate micro blueText din"><div class="right">◈</div><div class="num">1234 A</div><div class="right"><small>MC</small></div></div>`,['1234 A','Monegasque serial.'],['Crest','Monaco arms at left.'],['MC','Country identifier.'],['Compact plate','Distinctive small format.'],'Age ❌ · Location ❌'),
E('me','Montenegro',`<div class="plate din"><div class="eu"><b>MNE</b></div><div class="num">PG <span class="seal">⚜</span> AA 123</div></div>`,['PG','Municipality: Podgorica.'],['AA 123','Local serial.'],['National crest','Separates municipality and serial.'],['MNE','Country identifier.'],'Municipality ✅ · Age ❌'),
E('nl','Netherlands',EU('NL','G-123-BC','yellow din'),['G-123-BC','One of the current sidecode patterns.'],['Yellow background','Standard Dutch passenger-car plate.'],['Black border','Characteristic black frame.'],['EU band','NL identifier.'],'Age ❌ · Location ❌'),
E('mk','North Macedonia',`<div class="plate din"><div class="right">🇲🇰<small>NMK</small></div><div class="num">SK 1234 AB</div></div>`,['SK','Registration area: Skopje.'],['1234 AB','Local serial.'],['NMK','International identifier.'],['Flag band','National flag at left.'],'Area ✅ · Age ❌'),
E('no','Norway',`<div class="plate din"><div class="right">🇳🇴<small>N</small></div><div class="num">AB 12345</div></div>`,['AB','Allocated registration-office series.'],['12345','Serial digits.'],['Flag + N','Norway identifier.'],['White/black','Ordinary passenger plate.'],'Allocation area clue ✅ · Age ❌'),
E('pl','Poland',EU('PL','WA 12345','din'),['W','Masovian voivodeship.'],['A','Warsaw/local registration code.'],['12345','Serial.'],['EU band','PL identifier.'],'Registration area ✅ · Age ❌'),
E('pt','Portugal',EU('P','AA 01 AA','din'),['AA 01 AA','Current national sequence.'],['No yellow date band','Month/year strip was removed in 2020.'],['EU band','P identifier.'],['520 × 110 mm','Ordinary long plate.'],'Age ❌ · Location ❌'),
E('ro','Romania',EU('RO','B 123 ABC','din'),['B','Bucharest registration code.'],['123 ABC','Local serial.'],['EU band','RO identifier.'],['White/black','Ordinary passenger plate.'],'County/city ✅ · Age ❌'),
E('ru','Russia',`<div class="plate din"><div class="num">A123BC</div><div class="right"><b>77</b><small>RUS 🇷🇺</small></div></div>`,['A123BC','Vehicle serial.'],['77','Registration region code: Moscow.'],['RUS + flag','Country identifier at right.'],['White/black','Ordinary private vehicle plate.'],'Region ✅ · Age ❌'),
E('sm','San Marino',`<div class="plate micro blueText din"><div class="right">🛡️</div><div class="num">A1234</div></div>`,['A1234','National serial.'],['Crest','San Marino coat of arms.'],['Blue characters','Distinctive ordinary plate styling.'],['Compact plate','Smaller than standard EU long plates.'],'Age ❌ · Location ❌'),
E('rs','Serbia',`<div class="plate din"><div class="eu"><b>SRB</b></div><div class="num">BG <span class="seal">⚜</span> 123-AA</div></div>`,['BG','Registration area: Belgrade.'],['123-AA','Local serial.'],['Crest','Serbian arms separate groups.'],['SRB','Country identifier.'],'Area ✅ · Age ❌'),
E('sk','Slovakia',EU('SK','AA 123AA','din'),['AA','Current national series.'],['123AA','Serial continuation.'],['2023 change','Current system no longer encodes district.'],['EU band','SK identifier.'],'Current plate: location ❌ · Age ❌'),
E('si','Slovenia',`<div class="plate si din"><div class="eu"><span class="stars">••••••</span><b>SLO</b></div><div class="num">LJ <span class="seal">⚜</span> AB-123</div></div>`,['LJ','Registration area: Ljubljana.'],['AB-123','Serial.'],['Local crest','Coat of arms appears between groups.'],['Green edging','Ordinary Slovenian plates have a green border.'],'Area ✅ · Age ❌'),
E('es','Spain',EU('E','1234 BCD','din'),['1234','National serial digits.'],['BCD','National letter series.'],['EU band','E identifier.'],['520 × 110 mm','Ordinary long plate; 77 mm characters.'],'Province ❌ · Exact age ❌'),
E('se','Sweden',EU('S','ABC 12D','din'),['ABC 12D','Current ordinary serial format.'],['EU band','S identifier.'],['520 × 110 mm','Standard single-row plate.'],['National sequence','No locality encoded.'],'Age ❌ · Location ❌'),
E('ch','Switzerland',`<div class="plate swiss din"><div class="right">🇨🇭</div><div class="num">ZH 123456</div><div class="right">🛡️</div></div>`,['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Swiss shield','National arms at left.'],['Canton shield','Cantonal arms at right.'],'Canton ✅ · Age ❌'),
E('tr','Türkiye',`<div class="plate din"><div class="eu"><b>TR</b></div><div class="num">34 ABC 123</div></div>`,['34','Province code: Istanbul.'],['ABC 123','Local serial.'],['TR band','Country identifier at left.'],['White/black','Ordinary private vehicle plate.'],'Province ✅ · Age ❌'),
E('ua','Ukraine',`<div class="plate din"><div class="right">🇺🇦<small>UA</small></div><div class="num">AA 1234 BB</div></div>`,['AA','Registration region code: Kyiv city.'],['1234 BB','Serial.'],['UA + flag','Country identifier at left.'],['White/black','Ordinary passenger plate.'],'Region ✅ · Age ❌'),
E('gb','United Kingdom',`<div class="plate ukrear din"><div class="num">AB26 CDE</div></div>`,['AB','Local memory tag: first-registration area.'],['26','Age identifier: Mar–Aug 2026.'],['CDE','Random letters.'],['Rear yellow','Rear shown; front plate is white.'],'Age ✅ · First-registration area ✅'),
E('va','Vatican City',`<div class="plate micro din"><div class="right">⚜</div><div class="num">CV 12345</div></div>`,['CV','Civil Vatican registration prefix.'],['12345','Serial digits.'],['SCV','Official/state vehicles use SCV instead.'],['Compact white plate','Black characters with Vatican emblem.'],'Age ❌ · Location ❌')];
D.sort((a,b)=>a.name.localeCompare(b.name));const sel=document.getElementById('country');D.forEach(d=>sel.add(new Option(`${F(d.code==='xk'?'xk':d.code)} ${d.name}`,d.code)));sel.value='fr';const box=x=>`<div class="callout"><b>${x[0]}</b><span>${x[1]}</span></div>`;function render(k){let d=D.find(x=>x.code===k);document.getElementById('title').textContent=`${F(k==='xk'?'xk':k)} How a ${d.name} plate works`;document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('stage').innerHTML=d.plate;document.getElementById('bottom').innerHTML=d.boxes.slice(2).map(box).join('');document.getElementById('note').textContent=d.note}sel.onchange=e=>render(e.target.value);render('fr');</script></body></html>
