<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platewise — European number plates</title><style>
:root{--ink:#111820;--muted:#66717c;--paper:#f7f6f2;--blue:#0645a3;--line:#cfd5da}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{width:min(720px,100%);margin:auto;padding:12px 14px 20px;display:grid;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.15rem;font-weight:900}.brand span{color:var(--blue)}select{border:2px solid #171717;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;max-width:260px}.intro h1{font-size:clamp(1.35rem,5.5vw,2rem);line-height:1.05;margin:2px 0}.diagram{border:1px solid #e0e3e5;background:#ffffffb8;border-radius:22px;padding:12px 10px;display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.callout{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;min-height:72px}.callout b{font-size:.78rem}.callout span{display:block;color:var(--muted);font-size:.66rem;line-height:1.27;margin-top:3px}.stage{padding:9px 5px;min-height:118px;display:grid;place-items:center}.plate-img{display:block;max-width:100%;max-height:150px;width:auto;height:auto;margin:auto}.plate-source{display:block;text-align:right;font-size:.46rem;color:#929aa1;margin:2px 6px 0;text-decoration:none}.fallback{width:min(100%,520px);aspect-ratio:520/110;margin:auto;background:#fff;border:2px solid #151515;border-radius:5px;display:flex;align-items:center;justify-content:center;font:800 clamp(1.7rem,8vw,3.5rem)/1 Arial,sans-serif;box-shadow:0 4px 0 #c8c8c8,0 8px 12px #0002}.note{text-align:center;font-size:.72rem;color:#234e7d;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:.66rem}@media(max-width:380px){.callout{min-height:68px}}</style></head><body><main class="app"><header><div class="brand">Plate<span>wise</span></div><select id="country"></select></header><section class="intro"><h1 id="title"></h1></section><section class="diagram"><div class="row" id="top"></div><div class="stage" id="stage"></div><div class="note" id="note"></div><div class="row" id="bottom"></div></section><div class="footer">Current ordinary passenger-car plate</div></main><script>
const F=c=>c.toUpperCase().replace(/./g,x=>String.fromCodePoint(127397+x.charCodeAt()));
const commons=(file,alt)=>`<div><img class="plate-img" src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(file)}" alt="${alt}"><a class="plate-source" href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(file)}" target="_blank" rel="noopener">Commons</a></div>`;
const fallback=n=>`<div class="fallback">${n}</div>`;
const rows=[

['ad','Andorra','A1234',['A1234','National serial.'],['Crest','Andorran coat of arms.'],['AND','Country identifier.'],['Compact format','Distinctive smaller plate.'],'Age ❌ · Location ❌'],
['at','Austria','W 12345 A',['W','Registration authority: Vienna.'],['12345 A','Local serial.'],['Coat of arms','Authority/state emblem separates the groups.'],['Red edging','Characteristic Austrian red border lines.'],'District ✅ · Age ❌'],
['by','Belarus','1234 AB-7',['1234 AB','Serial.'],['7','Registration region code.'],['BY','Country identifier.'],['Flag','National flag appears on the plate.'],'Region ✅ · Age ❌'],
['be','Belgium','2-ABC-123',['2','Series index.'],['ABC-123','Registration serial.'],['Red characters','Belgian ordinary plates use dark red characters.'],['EU band','B country identifier.'],'Age ❌ · Location ❌'],

['fr','France','AB-123-CD',['F','France / EU identifier.'],['AB-123-CD','Chronological SIV serial; not a date code.'],['Département','Right side is owner-chosen.'],['Regional mark','Must correspond to chosen département.'],'Age ❌ · Home location ❌'],

['it','Italy','GA 123 BC',['GA 123 BC','National serial.'],['Left band','EU + I identifier.'],['Year','Optional year marker can be shown.'],['Province','Optional province abbreviation can be shown.'],'Optional year/province can be displayed'],

['nl','Netherlands','G-123-BC',['G-123-BC','A current sidecode pattern.'],['Yellow background','Standard passenger-car colour.'],['Black border','Characteristic frame.'],['EU band','NL identifier.'],'Age ❌ · Location ❌'],
['mk','North Macedonia','SK 1234 AB',['SK','Skopje registration area.'],['1234 AB','Local serial.'],['NMK','International identifier.'],['Flag','National flag at left.'],'Area ✅ · Age ❌'],

['rs','Serbia','BG 123-AA',['BG','Belgrade area.'],['123-AA','Local serial.'],['Crest','Serbian arms separate groups.'],['SRB','Country identifier.'],'Area ✅ · Age ❌'],
['sk','Slovakia','AA 123AA',['AA','Current national series.'],['123AA','Serial continuation.'],['2023 change','No longer encodes district.'],['EU band','SK identifier.'],'Location ❌ · Age ❌'],
['si','Slovenia','LJ AB-123',['LJ','Ljubljana area.'],['AB-123','Serial.'],['Crest','Local arms appear between groups.'],['Green edging','Characteristic border.'],'Area ✅ · Age ❌'],

['ch','Switzerland','ZH 123456',['ZH','Canton: Zürich.'],['123456','Cantonal serial.'],['Swiss shield','National arms at left.'],['Cantonal shield','Canton arms at right.'],'Canton ✅ · Age ❌'],

['va','Vatican City','CV 12345',['CV','Civil Vatican prefix.'],['12345','Serial digits.'],['SCV','Official/state vehicles use SCV.'],['Compact white plate','Black characters with Vatican emblem.'],'Age ❌ · Location ❌']];
const imageFiles={
fi:'Finnish license plate.svg',fr:'France license plate (EN).png',de:'German license plate.svg',at:'Austrian license plate.svg',be:'Belgian license plate.svg',nl:'Dutch license plate.svg',es:'Spanish license plate.svg',it:'Italian license plate.svg',ie:'Irish license plate.svg',ch:'Switzerland Zürich registration plate new.jpg',gb:'Regular UK Rear Registration Plate.svg'};
const D=rows.map(r=>({code:r[0],name:r[1],serial:r[2],boxes:r.slice(3,7),note:r[7]})).sort((a,b)=>a.name.localeCompare(b.name));
const sel=document.getElementById('country');D.forEach(d=>sel.add(new Option(`${F(d.code==='xk'?'xk':d.code)} ${d.name}`,d.code)));sel.value='fi';const box=x=>`<div class="callout"><b>${x[0]}</b><span>${x[1]}</span></div>`;function render(k){const d=D.find(x=>x.code===k);document.getElementById('title').textContent=`${F(k==='xk'?'xk':k)} How a ${d.name} plate works`;document.getElementById('top').innerHTML=d.boxes.slice(0,2).map(box).join('');document.getElementById('stage').innerHTML=imageFiles[k]?commons(imageFiles[k],`${d.name} ordinary passenger-car number plate`):fallback(d.serial);document.getElementById('bottom').innerHTML=d.boxes.slice(2).map(box).join('');document.getElementById('note').textContent=d.note}sel.onchange=e=>render(e.target.value);render('fi');
</script></body></html>
