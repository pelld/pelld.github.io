<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>Road Spotter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">VEHICLE SPOTTING GAME</p>
        <h1>Road Spotter</h1>
      </div>
      <div class="total-pill" aria-live="polite"><span id="totalCount">0</span><small>seen</small></div>
    </header>

    <section class="toolbar" aria-label="Game controls">
      <button class="tab active" data-view="spot" type="button">Spot</button>
      <button class="tab" data-view="stats" type="button">Stats</button>
      <button class="undo" id="undoBtn" type="button" disabled>Undo</button>
    </section>

    <section id="spotView" class="view active">
      <div class="search-wrap">
        <input id="brandSearch" type="search" placeholder="Find a make…" autocomplete="off" spellcheck="false" aria-label="Find a manufacturer">
      </div>
      <p class="hint">Tap a logo when you see one. Hold it to choose a model.</p>
      <div id="brandGrid" class="brand-grid"></div>
    </section>

    <section id="statsView" class="view">
      <div class="stats-head">
        <div><strong id="uniqueBrands">0</strong><span>makes spotted</span></div>
        <div><strong id="uniqueModels">0</strong><span>models identified</span></div>
      </div>
      <div id="leaderboard" class="leaderboard"></div>
      <button id="resetBtn" class="reset" type="button">Reset all sightings</button>
    </section>
  </main>

  <div id="modelSheet" class="sheet" hidden>
    <button class="sheet-backdrop" id="sheetBackdrop" aria-label="Close model picker"></button>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <div id="sheetLogo" class="sheet-logo"></div>
        <div><p class="eyebrow">WHICH MODEL?</p><h2 id="sheetTitle"></h2></div>
        <button id="sheetClose" class="sheet-close" type="button" aria-label="Close">×</button>
      </div>
      <div id="modelButtons" class="model-buttons"></div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
