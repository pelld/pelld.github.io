<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<title>A–Z Place Spotter</title>
<style>
:root{--ink:#10202f;--muted:#70808f;--paper:#f5f2ea;--card:#fffdf8;--line:#d8d3c8;--blue:#2767e8;--gold:#f4bd4b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper)}body{color:var(--ink);font:500 16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0%,rgba(39,103,232,.10),transparent 28rem),var(--paper)}button,input,select{font:inherit;color:inherit}.app{width:min(720px,100%);margin:auto;padding:14px 14px 94px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.eyebrow{margin:0 0 3px;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1;letter-spacing:-.045em}.sub{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:430px}.tools{text-align:right}.score{font-size:27px;font-weight:900;line-height:1}.percent{color:var(--muted);font-size:10px}.lang{margin-top:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px 6px;font-size:11px}.progress{height:7px;background:#e5e0d5;border-radius:999px;overflow:hidden;margin-bottom:12px}.bar{height:100%;width:0;background:var(--blue);transition:.25s}.board{border:1px solid rgba(16,32,47,.08);border-radius:20px;background:rgba(255,253,248,.9);padding:12px;box-shadow:0 14px 40px rgba(16,32,47,.09)}.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.letter{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:#eeeae1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:3px;cursor:pointer}.letter b{font-size:21px;line-height:1}.letter small{display:block;width:100%;margin-top:3px;color:var(--muted);font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.letter.found{background:var(--blue);border-color:var(--blue);color:white}.letter.found small{color:#eaf0ff}.letter.selected{outline:3px solid var(--gold);outline-offset:1px}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;color:var(--muted);font-size:10px}.reset{border:0;background:none;color:var(--muted);font-size:9px;padding:3px;cursor:pointer}.entry-wrap{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(590px,calc(100% - 24px));transform:translateX(-50%)}.entry{display:grid;grid-template-columns:52px 1fr auto;gap:7px;padding:8px;border:1px solid rgba(16,32,47,.12);border-radius:17px;background:rgba(255,253,248,.97);box-shadow:0 14px 45px rgba(16,32,47,.22)}.chosen{display:grid;place-items:center;border-radius:11px;background:#e9e5dc;font-size:22px;font-weight:900}.entry input{width:100%;min-width:0;border:0;outline:0;border-radius:11px;background:#f1eee7;padding:12px;font-size:16px;font-weight:750}.entry button{border:0;border-radius:11px;background:var(--blue);color:white;padding:0 14px;font-weight:900}.hint{position:absolute;bottom:calc(100% + 7px);left:10px;background:var(--ink);color:white;padding:6px 9px;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.hint.show{opacity:1}@media(max-width:430px){.letters{grid-template-columns:repeat(7,1fr);gap:5px}.board{padding:9px}.letter{border-radius:9px}.letter b{font-size:19px}.entry{grid-template-columns:43px 1fr auto}.entry button{padding:0 11px}.sub{max-width:245px}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="eyebrow" data-t="eyebrow">Road-trip spotting game</p><h1>A–Z Places</h1><p class="sub" data-t="sub">Spot a place name on a road sign. Claim any letter it contains. One place, one letter.</p></div><div class="tools"><div class="score"><span id="count">0</span>/26</div><div class="percent" id="percent">0% spotted</div><select class="lang" id="lang"><option value="en">English</option><option value="fr">Français</option></select></div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="board"><div class="letters" id="letters"></div><div class="footer"><span id="latest">Nothing spotted yet</span><button class="reset" id="reset" data-t="reset">Reset</button></div></section>
</main>
<div class="entry-wrap"><div class="hint" id="hint"></div><form class="entry" id="form"><div class="chosen" id="chosen">A</div><input id="place" autocomplete="off" placeholder="Place name"><button type="submit" data-t="claim">Claim</button></form></div>
<script>
const KEY='az-place-spotter-v1',ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');let state=JSON.parse(localStorage.getItem(KEY)||'{"spots":{},"lang":"en"}');state.spots=state.spots||{};state.lang=state.lang==='fr'?'fr':'en';let selected='A';
const T={en:{eyebrow:'Road-trip spotting game',sub:'Spot a place name on a road sign. Claim any letter it contains. One place, one letter.',reset:'Reset',claim:'Claim',placeholder:'Place name',spotted:'spotted',nothing:'Nothing spotted yet',latest:'Latest',contains:'doesn’t contain',used:'is already used for',choose:'Tap a letter first',confirm:'Reset all places?'},fr:{eyebrow:'Jeu de voyage',sub:'Repérez un nom de lieu sur un panneau. Choisissez une lettre qu’il contient. Un lieu, une lettre.',reset:'Réinitialiser',claim:'Ajouter',placeholder:'Nom du lieu',spotted:'trouvées',nothing:'Aucun lieu repéré',latest:'Dernier',contains:'ne contient pas',used:'est déjà utilisé pour',choose:'Choisissez une lettre',confirm:'Réinitialiser tous les lieux ?'}};
const letters=document.querySelector('#letters'),chosen=document.querySelector('#chosen'),place=document.querySelector('#place'),hint=document.querySelector('#hint'),langEl=document.querySelector('#lang');
function t(k){return T[state.lang][k]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}function message(s){hint.textContent=s;hint.classList.add('show');clearTimeout(hint.x);hint.x=setTimeout(()=>hint.classList.remove('show'),1800)}
function draw(){letters.innerHTML='';ABC.forEach(l=>{let b=document.createElement('button');b.type='button';b.className='letter'+(state.spots[l]?' found':'')+(selected===l?' selected':'');b.innerHTML=`<b>${l}</b><small>${state.spots[l]||''}</small>`;b.onclick=()=>{selected=l;chosen.textContent=l;draw();place.focus()};letters.appendChild(b)});let n=Object.keys(state.spots).length;document.querySelector('#count').textContent=n;document.querySelector('#percent').textContent=`${Math.round(n/26*100)}% ${t('spotted')}`;document.querySelector('#bar').style.width=`${n/26*100}%`;let last=state.last;document.querySelector('#latest').textContent=last?`${t('latest')}: ${last.letter} · ${last.place}`:t('nothing')}
function language(){document.documentElement.lang=state.lang;langEl.value=state.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));place.placeholder=t('placeholder');draw();save()}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let p=place.value.trim();if(!p)return;if(!norm(p).includes(selected)){message(`${p} ${t('contains')} ${selected}`);return}let duplicate=Object.entries(state.spots).find(([l,v])=>norm(v)===norm(p)&&l!==selected);if(duplicate){message(`${p} ${t('used')} ${duplicate[0]}`);return}state.spots[selected]=p;state.last={letter:selected,place:p};save();place.value='';place.blur();draw()};
document.querySelector('#reset').onclick=()=>{if(confirm(t('confirm'))){state.spots={};delete state.last;save();draw()}};langEl.onchange=()=>{state.lang=langEl.value;language()};language();
</script>
</body></html>
