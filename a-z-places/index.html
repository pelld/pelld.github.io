<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<title>A–Z Place Spotter</title>
<style>
:root{--ink:#10202f;--muted:#70808f;--paper:#f5f2ea;--card:#fffdf8;--line:#d8d3c8;--blue:#2767e8;--gold:#f4bd4b}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper)}body{color:var(--ink);font:500 16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0%,rgba(39,103,232,.10),transparent 28rem),var(--paper)}button,input,select{font:inherit;color:inherit}.app{width:min(720px,100%);margin:auto;padding:14px 14px 130px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.eyebrow{margin:0 0 3px;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,8vw,42px);line-height:1;letter-spacing:-.045em}.sub{margin:7px 0 0;color:var(--muted);font-size:13px;max-width:430px}.tools{text-align:right}.score{font-size:27px;font-weight:900;line-height:1}.percent{color:var(--muted);font-size:10px}.lang{margin-top:7px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px 6px;font-size:11px}.progress{height:7px;background:#e5e0d5;border-radius:999px;overflow:hidden;margin-bottom:12px}.bar{height:100%;width:0;background:var(--blue);transition:.25s}.board{border:1px solid rgba(16,32,47,.08);border-radius:20px;background:rgba(255,253,248,.9);padding:12px;box-shadow:0 14px 40px rgba(16,32,47,.09)}.letters{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.letter{aspect-ratio:1;border:1px solid var(--line);border-radius:11px;background:#eeeae1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:3px;cursor:pointer}.letter b{font-size:21px;line-height:1}.letter small{display:block;width:100%;margin-top:3px;color:var(--muted);font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.letter.found{background:var(--blue);border-color:var(--blue);color:white}.letter.found small{color:#eaf0ff}.letter.selected{outline:3px solid var(--gold);outline-offset:1px}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;color:var(--muted);font-size:10px}.reset{border:0;background:none;color:var(--muted);font-size:9px;padding:3px;cursor:pointer}.entry-wrap{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(590px,calc(100% - 24px));transform:translateX(-50%)}.entry-card{position:relative;padding:7px;border:1px solid rgba(16,32,47,.12);border-radius:17px;background:rgba(255,253,248,.98);box-shadow:0 14px 45px rgba(16,32,47,.22)}.entry{display:grid;grid-template-columns:1fr auto;gap:7px}.entry input{width:100%;min-width:0;border:0;outline:0;border-radius:11px;background:#f1eee7;padding:12px;font-size:16px;font-weight:750}.entry button{border:0;border-radius:11px;background:var(--blue);color:white;padding:0 14px;font-weight:900}.choice-row{display:flex;align-items:center;gap:5px;margin-top:6px;min-height:26px;overflow-x:auto;scrollbar-width:none}.choice-row::-webkit-scrollbar{display:none}.choice-label{flex:none;color:var(--muted);font-size:9px;margin-right:2px}.choice{flex:none;width:25px;height:25px;border:1px solid var(--line);border-radius:7px;background:#eeeae1;font-size:12px;font-weight:900;padding:0}.choice.available{background:#e5edff;border-color:#b7caf8;color:#1c56c7}.choice.active{background:var(--gold);border-color:var(--gold);color:var(--ink)}.choice:disabled{opacity:.32}.suggestions{position:absolute;left:7px;right:7px;bottom:calc(100% + 6px);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 14px 35px rgba(16,32,47,.18);display:none}.suggestions.show{display:block}.suggestion{width:100%;border:0;border-bottom:1px solid #ece7dd;background:var(--card);padding:9px 11px;text-align:left;cursor:pointer}.suggestion:last-child{border-bottom:0}.suggestion strong{display:block;font-size:13px}.suggestion small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.manual-note{padding:8px 11px;color:var(--muted);font-size:9px;background:#faf8f2}.hint{position:absolute;bottom:calc(100% + 7px);left:10px;background:var(--ink);color:white;padding:6px 9px;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.hint.show{opacity:1}.status{margin:4px 2px 0;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:430px){.letters{grid-template-columns:repeat(7,1fr);gap:5px}.board{padding:9px}.letter{border-radius:9px}.letter b{font-size:19px}.entry button{padding:0 11px}.sub{max-width:245px}.app{padding-bottom:130px}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="eyebrow" data-t="eyebrow">Road-trip spotting game</p><h1>A–Z Places</h1><p class="sub" data-t="sub">Spot a place name on a road sign. One place can claim one letter it contains.</p></div><div class="tools"><div class="score"><span id="count">0</span>/26</div><div class="percent" id="percent">0% spotted</div><select class="lang" id="lang"><option value="en">English</option><option value="fr">Français</option></select></div></header>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="board"><div class="letters" id="letters"></div><div class="footer"><span id="latest">Nothing spotted yet</span><button class="reset" id="reset" data-t="reset">Reset</button></div></section>
</main>
<div class="entry-wrap">
  <div class="hint" id="hint"></div>
  <div class="suggestions" id="suggestions"></div>
  <div class="entry-card">
    <form class="entry" id="form"><input id="place" autocomplete="off" placeholder="Search or type a place"><button type="submit" data-t="claim">Claim</button></form>
    <div class="choice-row"><span class="choice-label" data-t="letter">LETTER</span><div id="choices" style="display:flex;gap:5px"></div></div>
    <div class="status" id="status" data-t="typeHint">Type a place, then choose one of its unused letters.</div>
  </div>
</div>
<script>
const KEY='az-place-spotter-v1',ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');let state=JSON.parse(localStorage.getItem(KEY)||'{"spots":{},"lang":"en"}');state.spots=state.spots||{};state.lang=state.lang==='fr'?'fr':'en';let selected=null,searchTimer=null,searchSeq=0;
const T={en:{eyebrow:'Road-trip spotting game',sub:'Spot a place name on a road sign. One place can claim one letter it contains.',reset:'Reset',claim:'Claim',placeholder:'Search or type a place',spotted:'spotted',nothing:'Nothing spotted yet',latest:'Latest',used:'is already used for',choose:'Choose an unused letter from this place',confirm:'Reset all places?',letter:'LETTER',typeHint:'Type a place, then choose one of its unused letters.',searching:'Searching French communes…',manual:'Not listed? Keep typing and use your own place name.',noLetters:'No unused letters available in this place.',apiFail:'Commune search unavailable — manual entry still works.'},fr:{eyebrow:'Jeu de voyage',sub:'Repérez un nom de lieu sur un panneau. Un lieu peut valider une lettre qu’il contient.',reset:'Réinitialiser',claim:'Ajouter',placeholder:'Chercher ou saisir un lieu',spotted:'trouvées',nothing:'Aucun lieu repéré',latest:'Dernier',used:'est déjà utilisé pour',choose:'Choisissez une lettre disponible dans ce lieu',confirm:'Réinitialiser tous les lieux ?',letter:'LETTRE',typeHint:'Saisissez un lieu, puis choisissez une lettre disponible.',searching:'Recherche des communes françaises…',manual:'Pas dans la liste ? Continuez à saisir votre propre lieu.',noLetters:'Aucune lettre disponible dans ce lieu.',apiFail:'Recherche des communes indisponible — la saisie manuelle fonctionne toujours.'}};
const letters=document.querySelector('#letters'),place=document.querySelector('#place'),hint=document.querySelector('#hint'),langEl=document.querySelector('#lang'),choices=document.querySelector('#choices'),status=document.querySelector('#status'),suggestions=document.querySelector('#suggestions');
function t(k){return T[state.lang][k]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}function message(s){hint.textContent=s;hint.classList.add('show');clearTimeout(hint.x);hint.x=setTimeout(()=>hint.classList.remove('show'),1800)}
function availableLetters(name){let n=norm(name);return ABC.filter(l=>n.includes(l)&&!state.spots[l])}
function drawChoices(){let avail=availableLetters(place.value);if(selected&&!avail.includes(selected))selected=null;if(!selected&&avail.length===1)selected=avail[0];choices.innerHTML='';ABC.forEach(l=>{if(!norm(place.value).includes(l))return;let b=document.createElement('button');b.type='button';b.className='choice'+(avail.includes(l)?' available':'')+(selected===l?' active':'');b.textContent=l;b.disabled=!avail.includes(l);b.onclick=()=>{selected=l;drawChoices()};choices.appendChild(b)});if(!place.value.trim())status.textContent=t('typeHint');else if(!avail.length)status.textContent=t('noLetters');else if(!selected)status.textContent=t('choose');else status.textContent=`${selected} ← ${place.value.trim()}`}
function draw(){letters.innerHTML='';ABC.forEach(l=>{let b=document.createElement('button');b.type='button';b.className='letter'+(state.spots[l]?' found':'')+(selected===l?' selected':'');b.innerHTML=`<b>${l}</b><small>${state.spots[l]||''}</small>`;b.onclick=()=>{if(state.spots[l]){place.value=state.spots[l];selected=l;drawChoices();return}if(norm(place.value).includes(l)){selected=l;drawChoices()}else{selected=l;place.focus()}};letters.appendChild(b)});let n=Object.keys(state.spots).length;document.querySelector('#count').textContent=n;document.querySelector('#percent').textContent=`${Math.round(n/26*100)}% ${t('spotted')}`;document.querySelector('#bar').style.width=`${n/26*100}%`;let last=state.last;document.querySelector('#latest').textContent=last?`${t('latest')}: ${last.letter} · ${last.place}`:t('nothing');drawChoices()}
function language(){document.documentElement.lang=state.lang;langEl.value=state.lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));place.placeholder=t('placeholder');draw();save()}
function closeSuggestions(){suggestions.classList.remove('show')}
async function searchPlaces(q){let seq=++searchSeq;status.textContent=t('searching');try{let url=`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,departement&boost=population&limit=8`;let r=await fetch(url);if(!r.ok)throw new Error(r.status);let data=await r.json();if(seq!==searchSeq)return;suggestions.innerHTML='';data.slice(0,8).forEach(d=>{let b=document.createElement('button');b.type='button';b.className='suggestion';let dep=d.departement?.nom||d.codeDepartement||'';b.innerHTML=`<strong>${d.nom}</strong><small>${dep}</small>`;b.onclick=()=>{place.value=d.nom;selected=null;closeSuggestions();drawChoices();place.blur()};suggestions.appendChild(b)});let note=document.createElement('div');note.className='manual-note';note.textContent=t('manual');suggestions.appendChild(note);suggestions.classList.add('show');drawChoices()}catch(e){if(seq!==searchSeq)return;closeSuggestions();status.textContent=t('apiFail')}}
place.addEventListener('input',()=>{selected=null;drawChoices();let q=place.value.trim();clearTimeout(searchTimer);if(q.length<2){closeSuggestions();return}searchTimer=setTimeout(()=>searchPlaces(q),180)});place.addEventListener('focus',()=>{let q=place.value.trim();if(q.length>=2)searchPlaces(q)});document.addEventListener('click',e=>{if(!e.target.closest('.entry-wrap'))closeSuggestions()});
document.querySelector('#form').onsubmit=e=>{e.preventDefault();let p=place.value.trim();if(!p)return;let avail=availableLetters(p);if(!selected||!avail.includes(selected)){message(avail.length?t('choose'):t('noLetters'));return}let duplicate=Object.entries(state.spots).find(([l,v])=>norm(v)===norm(p)&&l!==selected);if(duplicate){message(`${p} ${t('used')} ${duplicate[0]}`);return}state.spots[selected]=p;state.last={letter:selected,place:p};save();place.value='';selected=null;place.blur();closeSuggestions();draw()};
document.querySelector('#reset').onclick=()=>{if(confirm(t('confirm'))){state.spots={};delete state.last;selected=null;save();draw()}};langEl.onchange=()=>{state.lang=langEl.value;language()};language();
</script>
</body></html>
