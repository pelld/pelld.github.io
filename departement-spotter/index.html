<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>Département Spotter</title>
  <meta name="description" content="Spot French département numbers on number plates and collect all 101.">
  <style>
    /* ========================================================================== */
    /* 01. TOKENS + RESET                                                         */
    /* ========================================================================== */
    :root { --ink:#10202f; --muted:#70808f; --paper:#f5f2ea; --card:#fffdf8; --line:#d8d3c8; --blue:#2767e8; --blue2:#76a1ff; --gold:#f4bd4b; --shadow:0 18px 55px rgba(16,32,47,.11); }
    * { box-sizing:border-box; }
    html { background:var(--paper); }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 85% 0%,rgba(39,103,232,.10),transparent 35rem),var(--paper); font:500 16px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select { font:inherit; }
    button,select { color:inherit; }

    /* ========================================================================== */
    /* 02. APP SHELL                                                              */
    /* ========================================================================== */
    .app { width:min(1000px,100%); margin:auto; padding:20px clamp(14px,3vw,30px) 115px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; margin-bottom:16px; }
    .header-main { min-width:0; }
    .eyebrow { margin:0 0 4px; color:var(--blue); font-size:11px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(28px,5vw,46px); line-height:1; letter-spacing:-.045em; }
    .sub { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .header-tools { display:flex; align-items:flex-end; gap:12px; }
    .language { display:flex; flex-direction:column; gap:4px; }
    .language label { color:var(--muted); font-size:10px; font-weight:800; text-align:right; text-transform:uppercase; letter-spacing:.08em; }
    .language select { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:7px 9px; font-size:13px; font-weight:750; outline:none; }
    .score { text-align:right; white-space:nowrap; }
    .score strong { display:block; font-size:clamp(29px,5vw,44px); line-height:1; letter-spacing:-.04em; }
    .score small { color:var(--muted); }
    .progress-track { height:9px; overflow:hidden; border-radius:999px; background:#e5e0d5; margin-bottom:16px; }
    .progress-bar { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--blue2)); transition:width .35s ease; }

    /* ========================================================================== */
    /* 03. MAP BOARD                                                              */
    /* ========================================================================== */
    .board { overflow:hidden; border:1px solid rgba(16,32,47,.08); border-radius:24px; background:rgba(255,253,248,.87); box-shadow:var(--shadow); }
    .map-shell { min-height:420px; display:grid; place-items:center; padding:14px 18px 8px; }
    #mapHost { width:min(650px,100%); }
    #mapHost svg { display:block; width:100%; height:auto; max-height:620px; overflow:visible; }
    #mapHost path { fill:#e4e1d9; stroke:#fffdf8; stroke-width:1.35; cursor:pointer; transition:fill .2s,filter .2s,transform .2s; transform-box:fill-box; transform-origin:center; }
    #mapHost path:hover { fill:#cbd7ee; filter:drop-shadow(0 2px 3px rgba(16,32,47,.18)); }
    #mapHost path.found { fill:var(--blue); }
    #mapHost path.just-found { animation:pulse .8s ease; }
    .map-code { pointer-events:none; text-anchor:middle; dominant-baseline:central; fill:#263747; font-weight:900; paint-order:stroke; stroke:rgba(255,253,248,.92); stroke-width:2.4px; stroke-linejoin:round; }
    .map-code.found { fill:#fff; stroke:rgba(16,32,47,.28); }
    .map-code.just-found { fill:#10202f; stroke:#fff; }
    @keyframes pulse { 0%{transform:scale(1)} 35%{transform:scale(1.10);fill:var(--gold);filter:drop-shadow(0 3px 6px rgba(16,32,47,.25))} 100%{transform:scale(1)} }
    .loading { color:var(--muted); font-weight:800; text-align:center; padding:80px 20px; }
    .fallback { width:100%; }
    .fallback p { margin:0 0 12px; color:var(--muted); text-align:center; }
    .code-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(48px,1fr)); gap:6px; }
    .code-grid button { border:1px solid var(--line); border-radius:9px; background:#eeeae1; padding:9px 4px; font-weight:850; cursor:pointer; }
    .code-grid button.found { color:white; border-color:var(--blue); background:var(--blue); }
    .board-footer { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:5px 18px 16px; }
    .last-found { color:var(--muted); font-size:13px; }
    .last-found strong { color:var(--ink); }
    .overseas-wrap { margin-left:auto; }
    .overseas-wrap details { position:relative; }
    .overseas-wrap summary { list-style:none; cursor:pointer; color:var(--muted); font-size:11px; font-weight:850; }
    .overseas-wrap summary::-webkit-details-marker { display:none; }
    .overseas-wrap summary::after { content:' ▾'; }
    .overseas-wrap details[open] summary::after { content:' ▴'; }
    .overseas { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; margin-top:7px; max-width:330px; }
    .overseas button { border:1px solid var(--line); border-radius:999px; background:#eeeae1; padding:5px 8px; font-size:11px; font-weight:850; cursor:pointer; }
    .overseas button.found { color:white; border-color:var(--blue); background:var(--blue); }
    .tiny-actions { margin-top:12px; text-align:right; }
    .tiny-actions button { border:0; background:none; color:var(--muted); font-size:11px; cursor:pointer; }

    /* ========================================================================== */
    /* 04. QUICK ENTRY                                                            */
    /* ========================================================================== */
    .entry-wrap { position:fixed; z-index:20; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); width:min(590px,calc(100% - 24px)); transform:translateX(-50%); }
    .entry { display:grid; grid-template-columns:1fr auto; gap:9px; padding:9px; border:1px solid rgba(16,32,47,.12); border-radius:18px; background:rgba(255,253,248,.97); box-shadow:0 16px 50px rgba(16,32,47,.22); backdrop-filter:blur(14px); }
    .entry input { width:100%; min-width:0; border:0; outline:0; border-radius:12px; background:#f1eee7; padding:14px 16px; color:var(--ink); font-size:20px; font-weight:850; }
    .entry input::placeholder { color:#8a969f; font-weight:650; }
    .entry button { min-width:94px; border:0; border-radius:12px; background:var(--blue); color:white; padding:0 18px; font-weight:900; cursor:pointer; }
    .entry-message { position:absolute; left:14px; bottom:calc(100% + 8px); padding:7px 11px; border-radius:9px; background:var(--ink); color:white; opacity:0; transform:translateY(5px); pointer-events:none; font-size:12px; transition:.2s; }
    .entry-message.show { opacity:1; transform:none; }

    /* ========================================================================== */
    /* 05. TOAST + COMPLETION                                                     */
    /* ========================================================================== */
    .toast { position:fixed; z-index:30; top:18px; left:50%; width:min(430px,calc(100% - 28px)); padding:14px 18px; border-radius:15px; background:var(--ink); color:white; box-shadow:var(--shadow); transform:translate(-50%,-140%); transition:transform .4s ease; text-align:center; font-weight:800; }
    .toast.show { transform:translate(-50%,0); }
    dialog { width:min(560px,calc(100% - 28px)); border:0; border-radius:24px; padding:0; background:var(--card); color:var(--ink); box-shadow:0 30px 90px rgba(16,32,47,.35); }
    dialog::backdrop { background:rgba(13,27,42,.72); backdrop-filter:blur(5px); }
    .finish { padding:34px; text-align:center; }
    .finish .trophy { font-size:72px; }
    .finish h2 { margin:4px 0 8px; font-size:38px; }
    .finish p { color:var(--muted); }
    .finish input { width:100%; margin:12px 0; border:1px solid var(--line); border-radius:12px; background:#f4f1e9; padding:13px; text-align:center; }
    .finish button { border:0; border-radius:12px; background:var(--blue); color:white; padding:12px 18px; font-weight:850; cursor:pointer; }

    /* ========================================================================== */
    /* 06. MOBILE                                                                 */
    /* ========================================================================== */
    @media (max-width:700px) {
      .app { padding-top:14px; }
      header { align-items:flex-start; gap:10px; }
      .header-tools { flex-direction:column-reverse; align-items:flex-end; gap:7px; }
      .sub { max-width:225px; }
      .score strong { font-size:28px; }
      .language label { display:none; }
      .language select { padding:5px 7px; font-size:12px; }
      .board { border-radius:20px; }
      .map-shell { min-height:0; padding:8px 5px 3px; }
      #mapHost svg { max-height:510px; }
      .board-footer { align-items:flex-start; padding:4px 12px 12px; }
      .last-found { font-size:12px; max-width:70%; }
      .overseas-wrap summary { font-size:10px; }
      .overseas { position:absolute; right:0; z-index:5; width:240px; padding:8px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:var(--shadow); }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- ======================================================================== -->
    <!-- 01. HEADER + PROGRESS                                                    -->
    <!-- ======================================================================== -->
    <header>
      <div class="header-main">
        <p class="eyebrow" data-i18n="eyebrow">French plate hunt</p>
        <h1>Département Spotter</h1>
        <p class="sub" data-i18n="sub">See a département on a French number plate? Collect it.</p>
      </div>
      <div class="header-tools">
        <div class="language">
          <label for="languageSelect" data-i18n="language">Language</label>
          <select id="languageSelect" aria-label="Language">
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </div>
        <div class="score" aria-live="polite"><strong><span id="count">0</span>/101</strong><small id="percent">0% complete</small></div>
      </div>
    </header>
    <div class="progress-track"><div class="progress-bar" id="progress"></div></div>

    <!-- ======================================================================== -->
    <!-- 02. MAP + COMPACT OVERSEAS                                               -->
    <!-- ======================================================================== -->
    <section class="board">
      <div class="map-shell"><div id="mapHost"><div class="loading" data-i18n="drawing">Drawing France…</div></div></div>
      <div class="board-footer">
        <div class="last-found" id="lastFound" data-i18n="nothing">Nothing spotted yet</div>
        <div class="overseas-wrap">
          <details>
            <summary data-i18n="overseas">Overseas</summary>
            <div class="overseas" id="overseas"></div>
          </details>
        </div>
      </div>
    </section>
    <div class="tiny-actions"><button id="resetBtn" type="button" data-i18n="reset">Reset progress</button></div>
  </main>

  <!-- ========================================================================== -->
  <!-- 03. QUICK NUMERIC ENTRY                                                    -->
  <!-- ========================================================================== -->
  <div class="entry-wrap">
    <div class="entry-message" id="entryMessage"></div>
    <form class="entry" id="entryForm">
      <input id="codeInput" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" min="1" max="976" placeholder="Enter number — e.g. 76" aria-label="Département number">
      <button type="submit" data-i18n="spot">Spot it</button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <dialog id="finishDialog">
    <div class="finish">
      <div class="trophy">🏆</div>
      <h2>101 / 101</h2>
      <p data-i18n="finishText">You found every French département. That deserves the prize.</p>
      <input id="prizeInput" maxlength="80" placeholder="Set your prize — e.g. Parc Astérix day">
      <p id="prizeReveal" style="font-size:20px;font-weight:900;color:var(--ink)"></p>
      <button id="closeFinish" type="button" data-i18n="magnifique">Magnifique</button>
    </div>
  </dialog>

  <script>
    // ============================================================================
    // 00. CONSTANTS + STATE
    // ============================================================================
    const STORAGE_KEY = 'departement-spotter-v1';
    const SVG_URL = 'https://cdn.jsdelivr.net/npm/@svg-maps/france.departments@2.0.0/france.departments.svg';
    const OVERSEAS = [
      {code:'971',name:'Guadeloupe'}, {code:'972',name:'Martinique'}, {code:'973',name:'Guyane'},
      {code:'974',name:'La Réunion'}, {code:'976',name:'Mayotte'}
    ];
    const METRO_CODES = [...Array.from({length:19},(_,i)=>String(i+1).padStart(2,'0')),'2A','2B',...Array.from({length:75},(_,i)=>String(i+21))];
    const ALL_CODES = new Set([...METRO_CODES,...OVERSEAS.map(d=>d.code)]);
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"found":[],"prize":"","lang":"en"}');
    const found = new Set(Array.isArray(saved.found) ? saved.found.map(String) : []);
    const names = new Map(OVERSEAS.map(d=>[d.code,d.name]));
    let lang = saved.lang === 'fr' ? 'fr' : 'en';
    let toastTimer;

    const I18N = {
      en:{
        eyebrow:'French plate hunt', sub:'See a département on a French number plate? Collect it.', language:'Language', drawing:'Drawing France…',
        nothing:'Nothing spotted yet', overseas:'Overseas', reset:'Reset progress', spot:'Spot it', placeholder:'Enter number — e.g. 76', complete:'complete', latest:'Latest',
        invalid:'isn’t a département code', already:'already spotted', removed:'removed', mapFail:'Map could not load, so here are the département numbers instead.',
        finishText:'You found every French département. That deserves the prize.', prizePlaceholder:'Set your prize — e.g. Parc Astérix day', yourPrize:'Your prize', magnifique:'Magnifique',
        confirmReset:'Reset all spotted départements?', m10:'10 spotted — nice start!', m25:'25 spotted — quarter way!', m50:'50 spotted — halfway!', m75:'75 spotted — closing in!', m96:'Metropolitan France complete!', m101:'Every département. Complete!'
      },
      fr:{
        eyebrow:'Chasse aux plaques françaises', sub:'Vous voyez un numéro de département sur une plaque ? Ajoutez-le.', language:'Langue', drawing:'Carte de France…',
        nothing:'Aucun département repéré', overseas:'Outre-mer', reset:'Réinitialiser', spot:'Ajouter', placeholder:'Numéro — ex. 76', complete:'terminé', latest:'Dernier',
        invalid:'n’est pas un code de département', already:'déjà repéré', removed:'supprimé', mapFail:'La carte n’a pas pu se charger. Voici les numéros des départements.',
        finishText:'Vous avez trouvé tous les départements français. Vous méritez le prix.', prizePlaceholder:'Votre prix — ex. une journée au Parc Astérix', yourPrize:'Votre prix', magnifique:'Magnifique',
        confirmReset:'Réinitialiser tous les départements repérés ?', m10:'10 repérés — bon début !', m25:'25 repérés — un quart !', m50:'50 repérés — à mi-chemin !', m75:'75 repérés — presque !', m96:'France métropolitaine complète !', m101:'Tous les départements. Terminé !'
      }
    };

    // ============================================================================
    // 01. DOM
    // ============================================================================
    const mapHost = document.querySelector('#mapHost');
    const countEl = document.querySelector('#count');
    const percentEl = document.querySelector('#percent');
    const progressEl = document.querySelector('#progress');
    const inputEl = document.querySelector('#codeInput');
    const messageEl = document.querySelector('#entryMessage');
    const lastFoundEl = document.querySelector('#lastFound');
    const toastEl = document.querySelector('#toast');
    const finishDialog = document.querySelector('#finishDialog');
    const prizeInput = document.querySelector('#prizeInput');
    const prizeReveal = document.querySelector('#prizeReveal');
    const languageSelect = document.querySelector('#languageSelect');

    // ============================================================================
    // 02. HELPERS
    // ============================================================================
    function t(key) { return I18N[lang][key]; }
    function normaliseCode(value) {
      const raw = String(value).trim();
      if (!/^\d{1,3}$/.test(raw)) return raw;
      return raw.length === 1 ? raw.padStart(2,'0') : raw;
    }
    function nameFor(code) { return names.get(code) || `Département ${code}`; }
    function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify({found:[...found],prize:saved.prize||'',lang})); }
    function showMessage(text) {
      messageEl.textContent = text; messageEl.classList.add('show'); clearTimeout(messageEl._timer);
      messageEl._timer = setTimeout(()=>messageEl.classList.remove('show'),1800);
    }
    function showToast(text) {
      toastEl.textContent = text; toastEl.classList.add('show'); clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>toastEl.classList.remove('show'),2500);
    }

    // ============================================================================
    // 03. LANGUAGE
    // ============================================================================
    function applyLanguage() {
      document.documentElement.lang = lang;
      languageSelect.value = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { const key = el.dataset.i18n; if (I18N[lang][key]) el.textContent = I18N[lang][key]; });
      inputEl.placeholder = t('placeholder');
      prizeInput.placeholder = t('prizePlaceholder');
      refreshUI();
      persist();
    }

    // ============================================================================
    // 04. UI STATE
    // ============================================================================
    function refreshUI(justFound=null) {
      const n = found.size;
      countEl.textContent = n;
      percentEl.textContent = `${Math.round(n/101*100)}% ${t('complete')}`;
      progressEl.style.width = `${n/101*100}%`;

      document.querySelectorAll('[data-code]').forEach(el => el.classList.toggle('found',found.has(el.dataset.code)));
      document.querySelectorAll('.map-code').forEach(el => el.classList.toggle('found',found.has(el.dataset.code)));

      if (justFound) {
        const region = document.querySelector(`#mapHost path[data-code="${CSS.escape(justFound)}"]`);
        const label = document.querySelector(`#mapHost .map-code[data-code="${CSS.escape(justFound)}"]`);
        [region,label].filter(Boolean).forEach(el=>el.classList.add('just-found'));
        setTimeout(()=>[region,label].filter(Boolean).forEach(el=>el.classList.remove('just-found')),850);
        lastFoundEl.innerHTML = `${t('latest')}: <strong>${justFound} · ${nameFor(justFound)}</strong>`;
      } else if (!found.size) {
        lastFoundEl.textContent = t('nothing');
      }

      if (n === 101 && !finishDialog.open) {
        prizeInput.value = saved.prize || '';
        prizeReveal.textContent = saved.prize ? `${t('yourPrize')}: ${saved.prize}` : '';
        finishDialog.showModal();
      }
    }

    // ============================================================================
    // 05. COLLECT / REMOVE
    // ============================================================================
    function validCode(code) { return ALL_CODES.has(code); }
    function collect(rawCode) {
      const code = normaliseCode(rawCode);
      if (!validCode(code)) { showMessage(`“${code || rawCode}” ${t('invalid')}`); return; }
      if (found.has(code)) { showMessage(`${code} · ${nameFor(code)} ${t('already')}`); return; }

      found.add(code); persist(); refreshUI(code); showMessage(`${code} · ${nameFor(code)} ✓`);
      const milestones = {10:t('m10'),25:t('m25'),50:t('m50'),75:t('m75'),96:t('m96'),101:t('m101')};
      if (milestones[found.size]) showToast(milestones[found.size]);
    }
    function toggleCollect(code) {
      if (found.has(code)) { found.delete(code); persist(); refreshUI(); showMessage(`${code} ${t('removed')}`); }
      else collect(code);
    }

    // ============================================================================
    // 06. COMPACT OVERSEAS
    // ============================================================================
    const overseasEl = document.querySelector('#overseas');
    OVERSEAS.forEach(d => {
      const button = document.createElement('button');
      button.type='button'; button.dataset.code=d.code; button.textContent=`${d.code} · ${d.name}`;
      button.addEventListener('click',()=>toggleCollect(d.code));
      overseasEl.appendChild(button);
    });

    // ============================================================================
    // 07. MAP + NUMBER LABELS
    // ============================================================================
    function attachMapInteractions(svg) {
      const paths = [...svg.querySelectorAll('path[id]')];
      paths.forEach(path => {
        const code = String(path.id).toUpperCase();
        if (!METRO_CODES.includes(code)) return;
        path.dataset.code = code;
        names.set(code,path.getAttribute('aria-label') || `Département ${code}`);
        path.setAttribute('tabindex','0');
        path.setAttribute('role','button');
        path.addEventListener('click',()=>toggleCollect(code));
        path.addEventListener('keydown',event=>{ if(event.key==='Enter'||event.key===' '){ event.preventDefault(); toggleCollect(code); } });
      });

      const labels = document.createElementNS('http://www.w3.org/2000/svg','g');
      labels.setAttribute('class','map-labels');
      svg.appendChild(labels);

      paths.forEach(path => {
        const code = path.dataset.code;
        if (!code) return;
        const box = path.getBBox();
        const size = Math.max(5.5,Math.min(10,Math.min(box.width,box.height)*0.42));
        const text = document.createElementNS('http://www.w3.org/2000/svg','text');
        text.setAttribute('x',box.x + box.width/2);
        text.setAttribute('y',box.y + box.height/2);
        text.setAttribute('font-size',size);
        text.setAttribute('class','map-code');
        text.dataset.code = code;
        text.textContent = code;
        labels.appendChild(text);
      });
      refreshUI();
    }

    async function drawMap() {
      try {
        const response = await fetch(SVG_URL,{cache:'force-cache'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const svgText = await response.text();
        const doc = new DOMParser().parseFromString(svgText,'image/svg+xml');
        const svg = doc.documentElement;
        svg.removeAttribute('width'); svg.removeAttribute('height');
        mapHost.replaceChildren(document.importNode(svg,true));
        attachMapInteractions(mapHost.querySelector('svg'));
      } catch(err) {
        console.error(err);
        const fallback = document.createElement('div'); fallback.className='fallback';
        const p = document.createElement('p'); p.textContent=t('mapFail'); fallback.appendChild(p);
        const grid = document.createElement('div'); grid.className='code-grid';
        METRO_CODES.forEach(code=>{ const b=document.createElement('button'); b.type='button'; b.dataset.code=code; b.textContent=code; b.addEventListener('click',()=>toggleCollect(code)); grid.appendChild(b); });
        fallback.appendChild(grid); mapHost.replaceChildren(fallback); refreshUI();
      }
    }

    // ============================================================================
    // 08. INPUT + SETTINGS
    // ============================================================================
    document.querySelector('#entryForm').addEventListener('submit',event=>{
      event.preventDefault();
      collect(inputEl.value);
      inputEl.value='';
      inputEl.focus();
    });

    languageSelect.addEventListener('change',()=>{ lang=languageSelect.value==='fr'?'fr':'en'; applyLanguage(); });

    document.querySelector('#resetBtn').addEventListener('click',()=>{
      if (!confirm(t('confirmReset'))) return;
      found.clear(); persist(); refreshUI();
    });

    prizeInput.addEventListener('input',()=>{
      saved.prize=prizeInput.value.trim(); persist(); prizeReveal.textContent=saved.prize?`${t('yourPrize')}: ${saved.prize}`:'';
    });
    document.querySelector('#closeFinish').addEventListener('click',()=>finishDialog.close());

    // ============================================================================
    // 09. START
    // ============================================================================
    applyLanguage();
    drawMap();
  </script>
</body>
</html>
