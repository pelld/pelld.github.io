<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>Département Spotter</title>
  <meta name="description" content="Spot French département numbers on number plates and collect all 101.">
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    /* ========================================================================== */
    /* 01. TOKENS + RESET                                                         */
    /* ========================================================================== */
    :root { --ink:#10202f; --muted:#70808f; --paper:#f5f2ea; --card:#fffdf8; --line:#d8d3c8; --blue:#2767e8; --blue2:#76a1ff; --gold:#f4bd4b; --green:#30a46c; --shadow:0 18px 55px rgba(16,32,47,.11); }
    * { box-sizing:border-box; }
    html { background:var(--paper); }
    body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 85% 0%,rgba(39,103,232,.10),transparent 35rem),var(--paper); font:500 16px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }

    /* ========================================================================== */
    /* 02. APP SHELL                                                              */
    /* ========================================================================== */
    .app { width:min(1180px,100%); margin:auto; padding:22px clamp(14px,3vw,34px) 110px; }
    header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
    .eyebrow { margin:0 0 3px; color:var(--blue); font-size:12px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(28px,5vw,48px); line-height:1; letter-spacing:-.045em; }
    .sub { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .score { text-align:right; white-space:nowrap; }
    .score strong { display:block; font-size:clamp(30px,5vw,46px); line-height:1; letter-spacing:-.04em; }
    .score span { color:var(--muted); font-size:13px; }

    /* ========================================================================== */
    /* 03. PROGRESS                                                               */
    /* ========================================================================== */
    .progress-track { height:9px; overflow:hidden; border-radius:999px; background:#e5e0d5; margin-bottom:18px; }
    .progress-bar { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--blue),var(--blue2)); transition:width .45s cubic-bezier(.2,.8,.2,1); }

    /* ========================================================================== */
    /* 04. MAP BOARD                                                              */
    /* ========================================================================== */
    .board { position:relative; overflow:hidden; min-height:580px; border:1px solid rgba(16,32,47,.08); border-radius:26px; background:rgba(255,253,248,.82); box-shadow:var(--shadow); backdrop-filter:blur(12px); }
    #map { display:block; width:100%; height:auto; min-height:520px; touch-action:manipulation; }
    .dept { fill:#e4e1d9; stroke:#fffdf8; stroke-width:1.2; cursor:pointer; transition:fill .22s,filter .22s,transform .22s; vector-effect:non-scaling-stroke; }
    .dept:hover,.dept:focus { fill:#ccd7ed; filter:drop-shadow(0 2px 4px rgba(16,32,47,.18)); outline:none; }
    .dept.found { fill:var(--blue); }
    .dept.just-found { animation:pulse .7s ease; transform-box:fill-box; transform-origin:center; }
    @keyframes pulse { 0%{transform:scale(1)} 38%{transform:scale(1.08);fill:var(--gold)} 100%{transform:scale(1)} }
    .map-label { pointer-events:none; text-anchor:middle; dominant-baseline:central; font-size:9px; font-weight:850; fill:#536170; }
    .map-label.found { fill:white; }
    .loading { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-weight:750; }
    .loading.hidden { display:none; }

    /* ========================================================================== */
    /* 05. OVERSEAS + STATUS                                                      */
    /* ========================================================================== */
    .board-footer { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 18px 18px; }
    .overseas { display:flex; flex-wrap:wrap; gap:7px; }
    .overseas button { border:1px solid var(--line); border-radius:10px; background:#eeeae1; padding:7px 9px; font-size:12px; font-weight:850; cursor:pointer; }
    .overseas button.found { color:white; border-color:var(--blue); background:var(--blue); }
    .last-found { min-width:170px; color:var(--muted); text-align:right; font-size:13px; }
    .last-found strong { color:var(--ink); }

    /* ========================================================================== */
    /* 06. FIXED QUICK ENTRY                                                      */
    /* ========================================================================== */
    .entry-wrap { position:fixed; z-index:20; left:50%; bottom:max(14px,env(safe-area-inset-bottom)); width:min(590px,calc(100% - 24px)); transform:translateX(-50%); }
    .entry { display:grid; grid-template-columns:1fr auto; gap:9px; padding:9px; border:1px solid rgba(16,32,47,.12); border-radius:18px; background:rgba(255,253,248,.96); box-shadow:0 16px 50px rgba(16,32,47,.22); backdrop-filter:blur(14px); }
    .entry input { width:100%; min-width:0; border:0; outline:0; border-radius:12px; background:#f1eee7; padding:14px 16px; color:var(--ink); font-size:19px; font-weight:850; }
    .entry input::placeholder { color:#8a969f; font-weight:650; }
    .entry button { min-width:94px; border:0; border-radius:12px; background:var(--blue); color:white; padding:0 18px; font-weight:900; cursor:pointer; }
    .entry-message { position:absolute; left:14px; bottom:calc(100% + 8px); padding:7px 11px; border-radius:9px; background:var(--ink); color:white; opacity:0; transform:translateY(5px); pointer-events:none; font-size:12px; transition:.2s; }
    .entry-message.show { opacity:1; transform:none; }

    /* ========================================================================== */
    /* 07. MILESTONE + COMPLETION                                                 */
    /* ========================================================================== */
    .toast { position:fixed; z-index:30; top:18px; left:50%; width:min(430px,calc(100% - 28px)); padding:14px 18px; border-radius:15px; background:var(--ink); color:white; box-shadow:var(--shadow); transform:translate(-50%,-140%); transition:transform .45s cubic-bezier(.2,.8,.2,1); text-align:center; font-weight:800; }
    .toast.show { transform:translate(-50%,0); }
    dialog { width:min(560px,calc(100% - 28px)); border:0; border-radius:24px; padding:0; background:var(--card); color:var(--ink); box-shadow:0 30px 90px rgba(16,32,47,.35); }
    dialog::backdrop { background:rgba(13,27,42,.72); backdrop-filter:blur(5px); }
    .finish { padding:34px; text-align:center; }
    .finish .trophy { font-size:72px; }
    .finish h2 { margin:4px 0 8px; font-size:38px; letter-spacing:-.04em; }
    .finish p { color:var(--muted); }
    .finish input { width:100%; margin:12px 0; border:1px solid var(--line); border-radius:12px; background:#f4f1e9; padding:13px; text-align:center; }
    .finish button { border:0; border-radius:12px; background:var(--blue); color:white; padding:12px 18px; font-weight:850; cursor:pointer; }
    .tiny-actions { margin-top:13px; text-align:right; }
    .tiny-actions button { border:0; background:none; color:var(--muted); font-size:11px; cursor:pointer; }

    /* ========================================================================== */
    /* 08. MOBILE                                                                 */
    /* ========================================================================== */
    @media (max-width:700px) {
      .app { padding-top:16px; }
      header { align-items:flex-start; }
      .sub { max-width:230px; }
      .score strong { font-size:30px; }
      .board { min-height:0; border-radius:20px; }
      #map { min-height:390px; }
      .board-footer { align-items:flex-start; flex-direction:column; }
      .last-found { text-align:left; }
      .map-label { font-size:8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- ======================================================================== -->
    <!-- 01. HEADER + PROGRESS                                                    -->
    <!-- ======================================================================== -->
    <header>
      <div>
        <p class="eyebrow">French plate hunt</p>
        <h1>Département Spotter</h1>
        <p class="sub">See a département on a French number plate? Collect it.</p>
      </div>
      <div class="score" aria-live="polite"><strong><span id="count">0</span>/101</strong><span id="percent">0% complete</span></div>
    </header>
    <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>

    <!-- ======================================================================== -->
    <!-- 02. MAP                                                                  -->
    <!-- ======================================================================== -->
    <section class="board" aria-label="Map of French départements">
      <div class="loading" id="loading">Drawing France…</div>
      <svg id="map" viewBox="0 0 900 620" role="img" aria-label="Interactive map of metropolitan French départements"></svg>
      <div class="board-footer">
        <div>
          <div style="font-size:11px;color:var(--muted);font-weight:850;margin-bottom:6px;text-transform:uppercase;letter-spacing:.09em">Overseas</div>
          <div class="overseas" id="overseas"></div>
        </div>
        <div class="last-found" id="lastFound">Nothing spotted yet</div>
      </div>
    </section>
    <div class="tiny-actions"><button id="resetBtn" type="button">Reset progress</button></div>
  </main>

  <!-- ========================================================================== -->
  <!-- 03. QUICK ENTRY                                                            -->
  <!-- ========================================================================== -->
  <div class="entry-wrap">
    <div class="entry-message" id="entryMessage"></div>
    <form class="entry" id="entryForm">
      <input id="codeInput" autocomplete="off" autocapitalize="characters" inputmode="text" maxlength="3" placeholder="Enter département — e.g. 76" aria-label="Département number or Corsica code">
      <button type="submit">Spot it</button>
    </form>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- ========================================================================== -->
  <!-- 04. COMPLETION DIALOG                                                      -->
  <!-- ========================================================================== -->
  <dialog id="finishDialog">
    <div class="finish">
      <div class="trophy">🏆</div>
      <h2>101 / 101</h2>
      <p>You found every French département. That deserves the prize.</p>
      <input id="prizeInput" maxlength="80" placeholder="Set your prize — e.g. Parc Astérix day">
      <p id="prizeReveal" style="font-size:20px;font-weight:900;color:var(--ink)"></p>
      <button id="closeFinish" type="button">Magnifique</button>
    </div>
  </dialog>

  <script>
    // ============================================================================
    // 00. CONSTANTS + PERSISTED STATE
    // ============================================================================
    const STORAGE_KEY = 'departement-spotter-v1';
    const OVERSEAS = [
      { code:'971', name:'Guadeloupe' }, { code:'972', name:'Martinique' }, { code:'973', name:'Guyane' },
      { code:'974', name:'La Réunion' }, { code:'976', name:'Mayotte' }
    ];
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"found":[],"prize":""}');
    state.found = Array.isArray(state.found) ? state.found.map(String) : [];
    const found = new Set(state.found);
    let departmentByCode = new Map();
    let toastTimer;

    // ============================================================================
    // 01. DOM REFERENCES
    // ============================================================================
    const countEl = document.querySelector('#count');
    const percentEl = document.querySelector('#percent');
    const progressEl = document.querySelector('#progress');
    const inputEl = document.querySelector('#codeInput');
    const messageEl = document.querySelector('#entryMessage');
    const lastFoundEl = document.querySelector('#lastFound');
    const toastEl = document.querySelector('#toast');
    const finishDialog = document.querySelector('#finishDialog');
    const prizeInput = document.querySelector('#prizeInput');
    const prizeReveal = document.querySelector('#prizeReveal');

    // ============================================================================
    // 02. HELPERS
    // ============================================================================
    function normaliseCode(value) {
      const raw = String(value).trim().toUpperCase().replace(/\s+/g,'');
      if (raw === '2A' || raw === '2B') return raw;
      if (!/^\d{1,3}$/.test(raw)) return raw;
      if (raw.length === 1) return raw.padStart(2,'0');
      return raw;
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ found:[...found], prize:state.prize || '' }));
    }

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.classList.add('show');
      clearTimeout(messageEl._timer);
      messageEl._timer = setTimeout(() => messageEl.classList.remove('show'), 1800);
    }

    function showToast(text) {
      toastEl.textContent = text;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
    }

    function departmentName(code) {
      return departmentByCode.get(code)?.properties?.nom || OVERSEAS.find(d => d.code === code)?.name || `Département ${code}`;
    }

    // ============================================================================
    // 03. UI STATE
    // ============================================================================
    function refreshUI(justFoundCode = null) {
      const n = found.size;
      countEl.textContent = n;
      percentEl.textContent = `${Math.round(n / 101 * 100)}% complete`;
      progressEl.style.width = `${n / 101 * 100}%`;

      d3.selectAll('.dept').classed('found', d => found.has(String(d.properties.code))).classed('just-found', d => justFoundCode === String(d.properties.code));
      d3.selectAll('.map-label').classed('found', d => found.has(String(d.properties.code)));
      document.querySelectorAll('[data-overseas]').forEach(btn => btn.classList.toggle('found', found.has(btn.dataset.overseas)));

      if (justFoundCode) lastFoundEl.innerHTML = `Latest: <strong>${justFoundCode} · ${departmentName(justFoundCode)}</strong>`;
      if (n === 101 && !finishDialog.open) {
        prizeInput.value = state.prize || '';
        prizeReveal.textContent = state.prize ? `Your prize: ${state.prize}` : '';
        finishDialog.showModal();
      }
    }

    // ============================================================================
    // 04. COLLECT / UNCOLLECT
    // ============================================================================
    function validCode(code) {
      return departmentByCode.has(code) || OVERSEAS.some(d => d.code === code);
    }

    function collect(rawCode) {
      const code = normaliseCode(rawCode);
      if (!validCode(code)) { showMessage(`“${code || rawCode}” isn't a département code`); return; }
      if (found.has(code)) { showMessage(`${code} · ${departmentName(code)} already spotted`); return; }

      const before = found.size;
      found.add(code);
      persist();
      refreshUI(code);
      showMessage(`${code} · ${departmentName(code)} ✓`);

      const milestones = {10:'10 spotted — nice start!',25:'25 spotted — quarter way!',50:'50 spotted — halfway!',75:'75 spotted — closing in!',96:'Metropolitan France complete!',101:'Every département. Complete!'};
      if (milestones[found.size] && found.size !== before) showToast(milestones[found.size]);
      setTimeout(() => d3.selectAll('.dept').classed('just-found', false), 750);
    }

    function toggleCollect(code) {
      code = normaliseCode(code);
      if (found.has(code)) { found.delete(code); persist(); refreshUI(); showMessage(`${code} removed`); }
      else collect(code);
    }

    // ============================================================================
    // 05. OVERSEAS TILES
    // ============================================================================
    const overseasEl = document.querySelector('#overseas');
    OVERSEAS.forEach(d => {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.overseas = d.code;
      button.textContent = `${d.code} · ${d.name}`;
      button.addEventListener('click', () => toggleCollect(d.code));
      overseasEl.appendChild(button);
    });

    // ============================================================================
    // 06. MAP — OFFICIAL FRENCH ADMINISTRATIVE API
    // ============================================================================
    async function drawMap() {
      const url = 'https://geo.api.gouv.fr/departements?fields=nom,code,codeRegion,contour&format=geojson&geometry=contour';
      try {
        const geo = await fetch(url).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
        const metro = geo.features.filter(d => !['971','972','973','974','976'].includes(String(d.properties.code)));
        departmentByCode = new Map(geo.features.map(d => [String(d.properties.code),d]));

        const svg = d3.select('#map');
        const projection = d3.geoConicConformal().parallels([44,49]).rotate([-3,0]).fitExtent([[35,25],[865,585]], {type:'FeatureCollection',features:metro});
        const path = d3.geoPath(projection);

        svg.append('g').selectAll('path').data(metro).join('path')
          .attr('class','dept').attr('d',path).attr('tabindex',0).attr('role','button')
          .attr('aria-label',d => `${d.properties.code}, ${d.properties.nom}`)
          .on('click',(event,d) => toggleCollect(String(d.properties.code)))
          .on('keydown',(event,d) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggleCollect(String(d.properties.code)); } });

        svg.append('g').selectAll('text').data(metro.filter(d => path.area(d) > 270)).join('text')
          .attr('class','map-label').attr('transform',d => `translate(${path.centroid(d)})`).text(d => d.properties.code);

        document.querySelector('#loading').classList.add('hidden');
        refreshUI();
      } catch (err) {
        document.querySelector('#loading').textContent = 'Map could not load. Number entry still works after reconnecting.';
        console.error(err);
      }
    }

    // ============================================================================
    // 07. INPUT + SETTINGS
    // ============================================================================
    document.querySelector('#entryForm').addEventListener('submit', event => {
      event.preventDefault();
      collect(inputEl.value);
      inputEl.value = '';
      inputEl.focus();
    });

    document.querySelector('#resetBtn').addEventListener('click', () => {
      if (!confirm('Reset every spotted département?')) return;
      found.clear(); persist(); lastFoundEl.textContent = 'Nothing spotted yet'; refreshUI();
    });

    prizeInput.addEventListener('input', () => {
      state.prize = prizeInput.value.trim();
      prizeReveal.textContent = state.prize ? `Your prize: ${state.prize}` : '';
      persist();
    });
    document.querySelector('#closeFinish').addEventListener('click', () => finishDialog.close());

    drawMap();
  </script>
</body>
</html>
