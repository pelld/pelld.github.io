<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<title>Département Spotter</title>
<style>
:root{--ink:#10202f;--muted:#70808f;--paper:#f5f2ea;--card:#fffdf8;--line:#d8d3c8;--blue:#2767e8;--blue2:#76a1ff;--gold:#f4bd4b;--shadow:0 18px 55px rgba(16,32,47,.11)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper)}body{min-height:100vh;color:var(--ink);background:radial-gradient(circle at 85% 0%,rgba(39,103,232,.10),transparent 35rem),var(--paper);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}.app{width:min(1000px,100%);margin:auto;padding:20px clamp(14px,3vw,30px) 92px}header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.eyebrow{margin:0 0 4px;color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,5vw,46px);line-height:1;letter-spacing:-.045em}.sub{margin:8px 0 0;color:var(--muted);font-size:14px}.header-tools{display:flex;align-items:flex-end;gap:12px}.language{display:flex;flex-direction:column;gap:4px}.language label{color:var(--muted);font-size:10px;font-weight:800;text-align:right}.language select{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 9px;font-size:13px}.score{text-align:right;white-space:nowrap}.score strong{display:block;font-size:clamp(29px,5vw,44px);line-height:1}.score small{color:var(--muted)}.progress-track{height:9px;overflow:hidden;border-radius:999px;background:#e5e0d5;margin-bottom:16px}.progress-bar{width:0;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));transition:width .35s}.board{overflow:hidden;border:1px solid rgba(16,32,47,.08);border-radius:24px;background:rgba(255,253,248,.87);box-shadow:var(--shadow)}.map-shell{min-height:420px;display:grid;place-items:center;padding:14px 18px 8px}#mapHost{width:min(650px,100%)}#mapHost svg{display:block;width:100%;height:auto;max-height:620px;overflow:visible}#mapHost path{fill:#e4e1d9;stroke:#fffdf8;stroke-width:1.35;cursor:pointer;transition:fill .2s,filter .2s,transform .2s;transform-box:fill-box;transform-origin:center}#mapHost path.found{fill:var(--blue)}#mapHost path.latest{fill:var(--gold)!important;stroke:var(--ink)!important;stroke-width:4.5!important;filter:drop-shadow(0 0 7px rgba(244,189,75,.95));animation:latestPulse 1.1s ease-in-out 5 alternate}.map-code{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:#263747;font-weight:900;paint-order:stroke;stroke:rgba(255,253,248,.92);stroke-width:2.4px;stroke-linejoin:round}.map-code.found{fill:#fff;stroke:rgba(16,32,47,.28)}.map-code.latest{fill:var(--ink)!important;stroke:#fff!important;stroke-width:4px!important;font-size:12px!important}@keyframes latestPulse{from{filter:drop-shadow(0 0 2px rgba(244,189,75,.55));transform:scale(1.01)}to{filter:drop-shadow(0 0 11px rgba(244,189,75,1));transform:scale(1.08)}}.loading{color:var(--muted);text-align:center;padding:80px 20px;font-weight:800}.code-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:6px}.code-grid button{border:1px solid var(--line);border-radius:9px;background:#eeeae1;padding:9px 4px;font-weight:850}.code-grid button.found{color:white;background:var(--blue)}.code-grid button.latest{background:var(--gold);color:var(--ink);border:3px solid var(--ink)}.board-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:4px 16px 12px}.last-found{min-width:0;color:var(--muted);font-size:13px}.last-found strong{color:var(--ink)}.footer-tools{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}.reset-btn{border:0;background:none;padding:2px 0;color:var(--muted);font-size:10px}.overseas-wrap details{position:relative}.overseas-wrap summary{list-style:none;cursor:pointer;color:var(--muted);font-size:11px;font-weight:850}.overseas-wrap summary::-webkit-details-marker{display:none}.overseas-wrap summary::after{content:' ▾'}.overseas-wrap details[open] summary::after{content:' ▴'}.overseas{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;margin-top:7px;max-width:330px}.overseas button{border:1px solid var(--line);border-radius:999px;background:#eeeae1;padding:5px 8px;font-size:11px;font-weight:850}.overseas button.found{color:white;background:var(--blue)}.overseas button.latest{background:var(--gold);color:var(--ink);border:2px solid var(--ink)}.entry-wrap{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(590px,calc(100% - 24px));transform:translateX(-50%)}.entry{display:grid;grid-template-columns:1fr auto;gap:9px;padding:9px;border:1px solid rgba(16,32,47,.12);border-radius:18px;background:rgba(255,253,248,.97);box-shadow:0 16px 50px rgba(16,32,47,.22)}.entry input{width:100%;min-width:0;border:0;outline:0;border-radius:12px;background:#f1eee7;padding:14px 16px;font-size:20px;font-weight:850}.entry button{min-width:94px;border:0;border-radius:12px;background:var(--blue);color:white;padding:0 18px;font-weight:900}.entry-message{position:absolute;left:14px;bottom:calc(100% + 8px);padding:7px 11px;border-radius:9px;background:var(--ink);color:white;opacity:0;font-size:12px;transition:.2s}.entry-message.show{opacity:1}.toast{position:fixed;z-index:30;top:18px;left:50%;transform:translate(-50%,-140%);background:var(--ink);color:white;padding:14px 18px;border-radius:15px;transition:.3s}.toast.show{transform:translate(-50%,0)}dialog{width:min(560px,calc(100% - 28px));border:0;border-radius:24px;background:var(--card)}.finish{padding:34px;text-align:center}.finish input{width:100%;padding:13px}.finish button{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 18px}@media(max-width:700px){.app{padding:14px 14px 86px}header{align-items:flex-start;gap:10px}.header-tools{flex-direction:column-reverse;align-items:flex-end;gap:7px}.sub{max-width:225px}.score strong{font-size:28px}.language label{display:none}.language select{padding:5px 7px;font-size:12px}.board{border-radius:20px}.map-shell{min-height:0;padding:8px 5px 3px}#mapHost svg{max-height:510px}.board-footer{padding:3px 12px 10px}.last-found{max-width:58%;font-size:11px}.overseas{position:absolute;right:0;z-index:5;width:240px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card)}}
</style>
</head>
<body>
<main class="app">
<header><div><p class="eyebrow" data-i18n="eyebrow">French plate hunt</p><h1>Département Spotter</h1><p class="sub" data-i18n="sub">See a département on a French number plate? Collect it.</p></div><div class="header-tools"><div class="language"><label data-i18n="language">Language</label><select id="languageSelect"><option value="en">English</option><option value="fr">Français</option></select></div><div class="score"><strong><span id="count">0</span>/101</strong><small id="percent"></small></div></div></header>
<div class="progress-track"><div class="progress-bar" id="progress"></div></div>
<section class="board"><div class="map-shell"><div id="mapHost"><div class="loading" id="loading">Drawing France…</div></div></div><div class="board-footer"><div class="last-found" id="lastFound"></div><div class="footer-tools"><button class="reset-btn" id="resetBtn" data-i18n="reset">Reset</button><div class="overseas-wrap"><details><summary data-i18n="overseas">Overseas</summary><div class="overseas" id="overseas"></div></details></div></div></div></section>
</main>
<div class="entry-wrap"><div class="entry-message" id="entryMessage"></div><form class="entry" id="entryForm"><input id="codeInput" type="number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" min="1" max="976" placeholder="Enter number — e.g. 76"><button data-i18n="spot">Spot it</button></form></div>
<div class="toast" id="toast"></div>
<dialog id="finishDialog"><div class="finish"><h2>🏆 101 / 101</h2><p data-i18n="finishText"></p><input id="prizeInput"><p id="prizeReveal"></p><button id="closeFinish" data-i18n="magnifique">Magnifique</button></div></dialog>
<script>
const STORAGE_KEY='departement-spotter-v1';
const MAP_CACHE_KEY='departement-map-svg-v1';
const MAP_SOURCES=['https://raw.githubusercontent.com/VictorCazanave/svg-maps/master/packages/france.departments/france.departments.svg','https://cdn.jsdelivr.net/npm/@svg-maps/france.departments@2.0.0/france.departments.svg'];
const OVERSEAS=[{code:'971',name:'Guadeloupe'},{code:'972',name:'Martinique'},{code:'973',name:'Guyane'},{code:'974',name:'La Réunion'},{code:'976',name:'Mayotte'}];
const METRO_CODES=[...Array.from({length:19},(_,i)=>String(i+1).padStart(2,'0')),'2A','2B',...Array.from({length:75},(_,i)=>String(i+21))];
const ALL_CODES=new Set([...METRO_CODES,...OVERSEAS.map(d=>d.code)]);
const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"found":[],"lang":"en"}');
const found=new Set((saved.found||[]).map(String));
const names=new Map(OVERSEAS.map(d=>[d.code,d.name]));
let lang=saved.lang==='fr'?'fr':'en',latest=saved.latest||null,scrollBeforeKeyboard=0;
const I={en:{eyebrow:'French plate hunt',sub:'See a département on a French number plate? Collect it.',language:'Language',overseas:'Overseas',reset:'Reset',spot:'Spot it',complete:'complete',latest:'Latest',nothing:'Nothing spotted yet',invalid:'isn’t a département code',already:'already spotted',removed:'removed',finishText:'You found every French département. That deserves the prize.',magnifique:'Magnifique',drawing:'Drawing France…',mapFail:'Map unavailable — use the numbered fallback.'},fr:{eyebrow:'Chasse aux plaques françaises',sub:'Vous voyez un numéro de département sur une plaque ? Ajoutez-le.',language:'Langue',overseas:'Outre-mer',reset:'Réinitialiser',spot:'Ajouter',complete:'terminé',latest:'Dernier',nothing:'Aucun département repéré',invalid:'n’est pas un code de département',already:'déjà repéré',removed:'supprimé',finishText:'Vous avez trouvé tous les départements français.',magnifique:'Magnifique',drawing:'Carte de France…',mapFail:'Carte indisponible — utilisez les numéros.'}};
const q=s=>document.querySelector(s),mapHost=q('#mapHost'),input=q('#codeInput');
function t(k){return I[lang][k]}
function normalise(v){let r=String(v).trim();return /^\d$/.test(r)?'0'+r:r}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify({found:[...found],prize:saved.prize||'',lang,latest}))}
function nameFor(c){return names.get(c)||`Département ${c}`}
function msg(s){let e=q('#entryMessage');e.textContent=s;e.classList.add('show');clearTimeout(e.x);e.x=setTimeout(()=>e.classList.remove('show'),1800)}
function refresh(){q('#count').textContent=found.size;q('#percent').textContent=`${Math.round(found.size/101*100)}% ${t('complete')}`;q('#progress').style.width=`${found.size/101*100}%`;document.querySelectorAll('[data-code]').forEach(e=>{e.classList.toggle('found',found.has(e.dataset.code));e.classList.toggle('latest',e.dataset.code===latest)});document.querySelectorAll('.map-code').forEach(e=>{e.classList.toggle('found',found.has(e.dataset.code));e.classList.toggle('latest',e.dataset.code===latest)});q('#lastFound').innerHTML=latest?`${t('latest')}: <strong>${latest} · ${nameFor(latest)}</strong>`:t('nothing');if(found.size===101&&!q('#finishDialog').open)q('#finishDialog').showModal()}
function collect(raw){let c=normalise(raw);if(!ALL_CODES.has(c)){msg(`“${c}” ${t('invalid')}`);return}if(found.has(c)){latest=c;persist();refresh();msg(`${c} · ${nameFor(c)} ${t('already')}`);return}found.add(c);latest=c;persist();refresh();msg(`${c} · ${nameFor(c)} ✓`)}
function toggle(c){if(found.has(c)){found.delete(c);if(latest===c)latest=null;persist();refresh();msg(`${c} ${t('removed')}`)}else collect(c)}
const overseas=q('#overseas');OVERSEAS.forEach(d=>{let b=document.createElement('button');b.type='button';b.dataset.code=d.code;b.textContent=`${d.code} · ${d.name}`;b.onclick=()=>toggle(d.code);overseas.appendChild(b)});
function attach(svg){let paths=[...svg.querySelectorAll('path[id]')];paths.forEach(p=>{let c=String(p.id).toUpperCase();if(!METRO_CODES.includes(c))return;p.dataset.code=c;names.set(c,p.getAttribute('aria-label')||`Département ${c}`);p.onclick=()=>toggle(c)});let g=document.createElementNS('http://www.w3.org/2000/svg','g');svg.appendChild(g);paths.forEach(p=>{let c=p.dataset.code;if(!c)return,b=p.getBBox(),x=document.createElementNS('http://www.w3.org/2000/svg','text');x.setAttribute('x',b.x+b.width/2);x.setAttribute('y',b.y+b.height/2);x.setAttribute('font-size',Math.max(5.5,Math.min(10,Math.min(b.width,b.height)*.42)));x.setAttribute('class','map-code');x.dataset.code=c;x.textContent=c;g.appendChild(x)});refresh()}
function renderSvg(text){let d=new DOMParser().parseFromString(text,'image/svg+xml'),s=d.documentElement;if(s.nodeName.toLowerCase()!=='svg')throw new Error('Invalid SVG');s.removeAttribute('width');s.removeAttribute('height');mapHost.replaceChildren(document.importNode(s,true));attach(mapHost.querySelector('svg'))}
async function fetchWithTimeout(url,ms=4500){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),ms);try{const r=await fetch(url,{cache:'force-cache',signal:controller.signal});if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.text()}finally{clearTimeout(timer)}}
function fallback(){let wrap=document.createElement('div'),note=document.createElement('div'),g=document.createElement('div');note.className='loading';note.style.padding='10px 0 14px';note.textContent=t('mapFail');g.className='code-grid';METRO_CODES.forEach(c=>{let b=document.createElement('button');b.type='button';b.dataset.code=c;b.textContent=c;b.onclick=()=>toggle(c);g.appendChild(b)});wrap.append(note,g);mapHost.replaceChildren(wrap);refresh()}
async function draw(){const cached=localStorage.getItem(MAP_CACHE_KEY);if(cached){try{renderSvg(cached);return}catch(e){localStorage.removeItem(MAP_CACHE_KEY)}}for(const url of MAP_SOURCES){try{const text=await fetchWithTimeout(url);localStorage.setItem(MAP_CACHE_KEY,text);renderSvg(text);return}catch(e){console.warn('Map source failed',url,e)}}fallback()}
function language(){document.documentElement.lang=lang;q('#languageSelect').value=lang;document.querySelectorAll('[data-i18n]').forEach(e=>{if(t(e.dataset.i18n))e.textContent=t(e.dataset.i18n)});q('#loading')&&(q('#loading').textContent=t('drawing'));refresh();persist()}
input.addEventListener('focus',()=>{scrollBeforeKeyboard=window.scrollY});
q('#entryForm').onsubmit=e=>{e.preventDefault();if(!input.value)return;collect(input.value);input.value='';input.blur();setTimeout(()=>window.scrollTo({top:scrollBeforeKeyboard,left:0,behavior:'smooth'}),350)};
q('#languageSelect').onchange=()=>{lang=q('#languageSelect').value;language()};
q('#resetBtn').onclick=()=>{if(confirm(lang==='fr'?'Réinitialiser tous les départements ?':'Reset all spotted départements?')){found.clear();latest=null;persist();refresh()}};
q('#prizeInput').oninput=e=>{saved.prize=e.target.value.trim();persist();q('#prizeReveal').textContent=saved.prize?saved.prize:''};
q('#closeFinish').onclick=()=>q('#finishDialog').close();
language();draw();
</script>
</body></html>
